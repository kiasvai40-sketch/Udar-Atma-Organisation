/* ---------------- POINT LIST (সুপার অ্যাডমিন) ---------------- */
function ensurePointRules(){
  if(!db.pointRules || typeof db.pointRules!=='object') db.pointRules={plus:[],minus:[],seq:1};
  if(!Array.isArray(db.pointRules.plus)) db.pointRules.plus=[];
  if(!Array.isArray(db.pointRules.minus)) db.pointRules.minus=[];
  if(!db.pointRules.seq) db.pointRules.seq=1;
  return db.pointRules;
}
function bnNum(n){ return String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]); }
function pointCardHTML(type,editable){
  const rules=ensurePointRules()[type];
  const isPlus=type==='plus';
  const col=isPlus?'var(--success)':'var(--red)';
  const bg=isPlus?'var(--success-bg)':'var(--danger-bg)';
  return `<div class="card" style="margin-top:10px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <span style="width:30px;height:30px;border-radius:8px;background:${bg};color:${col};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;">${isPlus?'+':'−'}</span>
      <b style="font-size:14.5px;color:var(--navy);">${isPlus?'প্লাস পয়েন্ট (+)':'নেগেটিভ পয়েন্ট (−)'}</b>
    </div>
    ${rules.map((r,i)=>`<div class="list-item">
      <div class="ico rank-ico" style="background:${bg};color:${col};">${bnNum(i+1)}</div>
      <div class="meta"><b>${isPlus?'+':'−'}${bnNum(r.points)} পয়েন্ট</b><span>${esc(r.reason)}</span></div>
      ${editable?`<div style="display:flex;gap:6px;align-items:center;">
        <button class="btn btn-sm btn-ghost" style="padding:8px 10px;" aria-label="সম্পাদনা" onclick="openAddPointRule('${type}',${r.id})"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
        <button class="btn btn-sm btn-danger-outline" style="padding:8px 10px;" aria-label="মুছুন" onclick="confirmDeletePointRule('${type}',${r.id})"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6"/></svg></button>
      </div>`:''}
    </div>`).join('') || `<div style="font-size:12.5px;color:var(--muted);padding:8px 2px;">এখনো কোনো এন্ট্রি নেই</div>`}
    ${editable?`<div style="display:flex;justify-content:center;margin-top:10px;">
      <button class="icon-btn" style="background:${bg};border-color:${col};color:${col};" aria-label="${isPlus?'প্লাস':'নেগেটিভ'} পয়েন্ট এন্ট্রি যোগ করুন" onclick="openAddPointRule('${type}')"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>`:''}
  </div>`;
}
function pointListSectionHTML(editable){
  return `<div class="section-title"><h3><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a6 6 0 100-12 6 6 0 000 12zM8.2 14.5L7 22l5-3 5 3-1.2-7.5"/></svg> পয়েন্ট তালিকা</h3></div>
  <div class="point-list-wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;">
    ${pointCardHTML('plus',!!editable)}${pointCardHTML('minus',!!editable)}
  </div>`;
}
function openAddPointRule(type,ruleId){
  if(session.role!=='superadmin') return;
  const isPlus=type==='plus';
  const r = ruleId!=null ? ensurePointRules()[type].find(x=>x.id===ruleId) : null;
  openModal(`
    <div class="modal-title"><h3>${r?'এন্ট্রি সম্পাদনা':(isPlus?'প্লাস পয়েন্ট এন্ট্রি (+)':'নেগেটিভ পয়েন্ট এন্ট্রি (−)')}</h3><button onclick="closeModal()"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <label class="field"><span>পয়েন্ট</span><input id="prPoints" type="number" min="1" step="1" inputmode="numeric" placeholder="যেমন: ৫, ১০, ১৫" value="${r?r.points:''}"></label>
    <label class="field"><span>শর্ত</span><textarea id="prReason" placeholder="কারণ বা শর্ত লিখুন">${r?esc(r.reason):''}</textarea></label>
    <button class="btn ${isPlus?'btn-primary':'btn-red'}" onclick="savePointRule('${type}'${r?','+r.id:''})">Save</button>
  `);
}
function savePointRule(type,ruleId){
  if(session.role!=='superadmin') return;
  const pts=Number(document.getElementById('prPoints').value);
  const reason=document.getElementById('prReason').value.trim();
  const warn='<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>';
  if(!pts || pts<=0 || !Number.isFinite(pts)){ toast('সঠিক পয়েন্ট দিন',warn); return; }
  if(!reason){ toast('শর্ত লেখা আবশ্যক',warn); return; }
  const pr=ensurePointRules();
  const sign=type==='plus'?'+':'-', lbl=type==='plus'?'প্লাস':'নেগেটিভ';
  if(ruleId!=null){
    const r=pr[type].find(x=>x.id===ruleId);
    if(!r){ closeModal(); render(); return; }
    r.points=pts; r.reason=reason;
    addAudit(`পয়েন্ট তালিকার ${lbl} এন্ট্রি সম্পাদনা করেছেন (${sign}${pts})`, reason);
  } else {
    pr[type].push({id:pr.seq++, points:pts, reason});
    addAudit(`পয়েন্ট তালিকায় ${lbl} এন্ট্রি যোগ করেছেন (${sign}${pts})`, reason);
  }
  saveDB(); closeModal(); render();
  toast('এন্ট্রি সংরক্ষিত হয়েছে','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l5 5L20 7"/></svg>');
}
function confirmDeletePointRule(type,ruleId){
  if(session.role!=='superadmin') return;
  const r=ensurePointRules()[type].find(x=>x.id===ruleId); if(!r) return;
  openModal(`
    <div class="modal-title"><h3>এন্ট্রি মুছবেন?</h3><button onclick="closeModal()"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="reason-warn">${type==='plus'?'+':'−'}${bnNum(r.points)} পয়েন্ট — ${esc(r.reason)}<br>মুছলে এই শর্তটি আর নির্বাচন করা যাবে না। সদস্যদের আগে দেওয়া পয়েন্ট ও হিস্টোরি অপরিবর্তিত থাকবে।</div>
    <button class="btn btn-red" onclick="deletePointRule('${type}',${r.id})">হ্যাঁ, মুছে ফেলুন</button>
  `);
}
function deletePointRule(type,ruleId){
  if(session.role!=='superadmin') return;
  const pr=ensurePointRules();
  const r=pr[type].find(x=>x.id===ruleId);
  pr[type]=pr[type].filter(x=>x.id!==ruleId);
  if(r) addAudit(`পয়েন্ট তালিকার ${type==='plus'?'প্লাস':'নেগেটিভ'} এন্ট্রি মুছেছেন (${type==='plus'?'+':'-'}${r.points})`, r.reason);
  saveDB(); closeModal(); render();
  toast('এন্ট্রি মুছে ফেলা হয়েছে','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l5 5L20 7"/></svg>');
}

function openAddPoint(id,type){

async function submitPoint(id,type){
  const warn='<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>';
  if(!_ptSel || _ptSel.type!==type){ toast('কারণ (আবশ্যক) থেকে একটি শর্ত নির্বাচন করুন',warn); return; }
  const rule = ensurePointRules()[type].find(x=>x.id===_ptSel.ruleId);
  if(!rule){ toast('নির্বাচিত শর্তটি আর নেই, আবার নির্বাচন করুন',warn); return; }
  const amt = Number(rule.points);
  const reason = rule.reason;
  if(!amt || amt<=0){ toast('সঠিক পরিমাণ দিন',warn); return; }
  if(!reason){ toast('কারণ লেখা আবশ্যক',warn); return; }
  const m = getMember(id);
  if(type==='plus') m.plus+=amt; else m.minus+=amt;
  if(!db.pointHistory[id]) db.pointHistory[id]=[];
  db.pointHistory[id].unshift({type, amount:amt, reason, date:Date.now(), by: currentMember().name});
  addAudit(`পয়েন্ট যোগ করেছেন (${type==='plus'?'+':'-'}${amt})`, m.name);
  if(session.role==='admin') notifySuperAdmins('এডমিন পয়েন্ট দিয়েছেন', `${currentMember().name} → ${m.name}: ${type==='plus'?'+':'-'}${amt} — ${reason}`, 'point');
  notifyMember(m.id, type==='plus'?'প্লাস পয়েন্ট পেয়েছেন':'নেগেটিভ পয়েন্ট পেয়েছেন', `${type==='plus'?'+':'-'}${amt} পয়েন্ট — ${reason}`, 'point');
  _ptSel=null;
  closeModal(); render(); toast('পয়েন্ট আপডেট হয়েছে','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l5 5L20 7"/></svg>');
  await saveDB();
}

/* ---------------- NOTIFICATIONS HELPERS ---------------- */
function _actor(){ try{ return session && session.memberId || null; }catch(e){ return null; } }
function addNotification({to, title, body, type, refId, perm, dedupe}){
  if(!db.notifications) db.notifications = [];
  if(dedupe && db.notifications.some(n=>n.dedupe===dedupe)) return false;
  db.notifications.unshift({ id: Date.now()+Math.floor(Math.random()*1000), to, title:title||'', body:body||'', type:type||'general', refId:refId||null, perm:perm||null, by:_actor(), dedupe:dedupe||null, readBy:{}, createdAt:Date.now() });
  if(db.notifications.length > 600) db.notifications = db.notifications.slice(0, 600);
  return true;
}
function notifyMember(memberId, title, body, type, refId, dedupe){
  if(!addNotification({to: memberId, title, body, type, refId, dedupe})) return;
  pushToMember(memberId, title, body, type);
}
function notifyAdmins(title, body, type, refId, perm, dedupe){
  if(!addNotification({to:'admin', title, body, type, refId, perm, dedupe})) return;
  pushToAdmins(title, body, type);
}
function notifySuperAdmins(title, body, type, refId, dedupe){
  if(!addNotification({to:'superadmin', title, body, type, refId, dedupe: dedupe||null})) return;
  pushToSuperAdmins(title, body, type);
}
function notifyAll(title, body, type, refId, dedupe){
  if(!addNotification({to:'all', title, body, type, refId, dedupe: dedupe||null})) return;
  pushToAll(title, body, type);
}
function notifyBloodGroup(bg, title, body){ db.members.filter(x=>x.status==='ACTIVE' && x.role==='member' && x.bloodGroup===bg).forEach(x=>notifyMember(x.id, title, body, 'blood')); pushToBlood(bg, title, body); }
function hasPermission(p){ const m=currentMember(); return !p || !!(m && (m.role==='superadmin' || (m.permissions||[]).includes(p))); }
function isReadByMe(n){ return !!n.read || !!(n.readBy && session.memberId && n.readBy[session.memberId]); }
function myNotifications(){
  if(!db.notifications) return [];
  const mid = session.memberId, role = session.role;
  return db.notifications.filter(n=>{
    if(n.by && mid && n.by===mid && n.to!==mid) return false; // যিনি কাজটি করেছেন তিনি নিজের কাজের নোটিফিকেশন পান না
    if(n.to === 'all') return true;
    if(mid && n.to === mid) return true;
    if(n.to === 'admin') return role==='superadmin' || (role==='admin' && hasPermission(n.perm));
    if(n.to === 'superadmin') return role === 'superadmin';
    return false;
  });
}
function unreadCount(){ return myNotifications().filter(n=>!isReadByMe(n)).length; }
function askNotifPermission(){
  try{
    if(!('Notification' in window)){
      if(typeof toast==='function') toast('এই ডিভাইসে নোটিফিকেশন সাপোর্ট নেই','');
      return;
    }
    if(Notification.permission==='granted'){
      if(typeof requestFCMPermissionAndToken==='function') requestFCMPermissionAndToken();
      showPushSetupGuide(false);
      return;
    }
    if(Notification.permission==='denied'){
      showPushBlockedGuide();
      return;
    }
    Notification.requestPermission().then(function(p){
      if(p==='granted'){
        if(typeof requestFCMPermissionAndToken==='function') requestFCMPermissionAndToken();
        showPushSetupGuide(true);
      } else if(p==='denied'){
        showPushBlockedGuide();
      }
    }).catch(function(){});
  }catch(e){}
}
function notifPermCard(){
  if(!('Notification' in window)) return '';
  if(Notification.permission==='granted') return '';
  return `<div class="card" style="margin-bottom:10px;">

    <span style="font-size:13px;opacity:.85;display:block;margin-bottom:8px">Get alerts even when the app is closed.</span>
    <button class="btn btn-primary" style="width:100%" onclick="askNotifPermission();">Allow</button>
  </div>`;
}

    </div>

    <button class="btn btn-outline" style="width:100%" onclick="try{localStorage.setItem('push_setup_done','1');}catch(e){} closeModal();">Later</button>

function sysNotify(n){ try{
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  var title = (n && n.title) || 'UDAR ATMA';
  var body = (n && n.body) || '';
  var tag = String((n && n.id) || Date.now());
  var opts = { body: body, tag: tag, icon: (typeof NOTIF_ICON!=='undefined'?NOTIF_ICON:'/icon-192.png'), badge: '/badge-96.png' };
  if(navigator.serviceWorker){
    navigator.serviceWorker.ready.then(function(r){ return r.showNotification(title, opts); }).catch(function(){
      try{ new Notification(title, opts); }catch(e2){}
    });
  } else {
    try{ new Notification(title, opts); }catch(e3){}
  }
}catch(e){} }

function runReminders(){
  try{
    const m=currentMember(); if(!m || m.status!=='ACTIVE') return;
    const now=new Date(), ym=now.getFullYear()+'-'+(now.getMonth()+1), day=ym+'-'+now.getDate(), mon=CONTRIBUTION_MONTHS[now.getMonth()], before=db.notifications.length;
    if(m.role==='member'){
      /* বকেয়া চাঁদার সদস্য রিমাইন্ডার runDuesAutomation() (সাপ্তাহিক) পরিচালনা করে */
      if(m.lastDonationDate && daysBetween(m.lastDonationDate)>=120) notifyMember(m.id,'আবার রক্ত দিতে পারবেন','শেষ রক্তদানের পর ১২০ দিন পার হয়েছে।','blood',null,'elig-'+m.id+'-'+m.lastDonationDate);
    } else {
      const p=db.payments.filter(x=>x.status==='pending').length, r=db.members.filter(x=>x.status==='PENDING').length;
      if(p||r) notifyMember(m.id,'অপেক্ষমান কাজ',`${p}টি পেমেন্ট ও ${r}টি সদস্য আবেদন অপেক্ষায় আছে`,'general',null,'pend-'+m.id+'-'+day);
      /* মাসিক বকেয়া সারসংক্ষেপ — runDuesAutomation() প্রতি মাসে একবার */
    }
    (db.activities||[]).filter(a=>a.status==='upcoming').forEach(a=>{
      const d=new Date(a.date); if(isNaN(d)) return;
      const diff=Math.round((d-new Date(now.toDateString()))/86400000);
      if(diff===0||diff===1) notifyMember(m.id, diff?'আগামীকাল কার্যক্রম':'আজ কার্যক্রম', `${a.title} — ${a.location||''}`, 'event', null, 'evt-'+a.id+'-'+diff+'-'+m.id);
    });
    if(db.notifications.length!==before) saveDB();
  }catch(e){ console.warn('reminders', e); }
}
/* ---------------- মাসিক চাঁদা বকেয়া — স্বয়ংক্রিয় নোটিফিকেশন ---------------- */
/* বকেয়া শুরু: সদস্যের (যোগদান মাস বা জানুয়ারি) থেকে বর্তমান মাস পর্যন্ত যে মাসগুলোর চাঁদা paidMonths-এ নেই। ভবিষ্যতের মাস কখনো বকেয়া নয়। */
function duesStartIndex(m, now){
  const y = now.getFullYear(), cur = now.getMonth();
  const jd = bnDigitsToEn(m.joinDate||'');
  const ym = jd.match(/(\d{4})/);
  if(ym){
    const jy = Number(ym[1]);
    if(jy < y) return 0;
    if(jy > y) return 12;
  }
  let idx = CONTRIBUTION_MONTHS.findIndex(mn=>jd.indexOf(mn)>-1);
  if(idx<0) idx = CONTRIBUTION_MONTHS.findIndex(mn=>jd.indexOf(mn.slice(0,3))>-1);
  if(!ym && idx<0) return cur;           /* যোগদানের তারিখ বোঝা না গেলে শুধু বর্তমান মাস ধরা হয় */
  if(idx<0) return cur;
  return ym ? idx : cur;
}
function duesOverdueInfo(m, now){
  now = now || new Date();
  const cur = now.getMonth(), start = duesStartIndex(m, now), paid = paidMonthList(m), months = [];
  for(let i=start;i<=cur;i++){ const mn = CONTRIBUTION_MONTHS[i]; if(!paid.includes(mn)) months.push(mn); }
  return {count: months.length, months};
}
function runDuesAutomation(nowArg){
  /* মাসিক চাঁদা বকেয়া — সম্পূর্ণ স্বয়ংক্রিয়
     • সদস্য: বকেয়া থাকলে প্রতি ৭ দিনে একবার রিমাইন্ডার; সব পরিশোধ হলে বন্ধ
     • অ্যাডমিন/সুপার অ্যাডমিন: প্রতি ক্যালেন্ডার মাসে একবার সারসংক্ষেপ (কতজন অপরিশোধিত/বকেয়া)
     বিদ্যমান paidMonths, payments, duesOverdueInfo ব্যবহার করে */
  try{
    if(typeof db==='undefined' || !db || !Array.isArray(db.members)) return;
    const now = nowArg || new Date();
    const WEEK_MS = 7 * 86400000;
    if(!db.duesReminders) db.duesReminders = {};
    if(!Array.isArray(db.notifications)) db.notifications = [];
    let changed = false;
    const y = now.getFullYear(), mo = now.getMonth() + 1;
    const monthKey = y + '-' + mo;
    const monName = (typeof CONTRIBUTION_MONTHS!=='undefined' && CONTRIBUTION_MONTHS[now.getMonth()]) ? CONTRIBUTION_MONTHS[now.getMonth()] : (mo + '');

    /* —— ১) সদস্যদের সাপ্তাহিক বকেয়া রিমাইন্ডার —— */
    db.members.forEach(m=>{
      const st = db.duesReminders[m.id];
      if(m.role!=='member' || m.status!=='ACTIVE'){
        if(st){ delete db.duesReminders[m.id]; changed = true; }
        return;
      }
      const info = duesOverdueInfo(m, now);
      if(info.count===0){
        /* সব বকেয়া পরিশোধ — রিমাইন্ডার বন্ধ */
        if(st){ delete db.duesReminders[m.id]; changed = true; }
        return;
      }
      /* অনুমোদনের অপেক্ষায় পেমেন্ট থাকলে এই সপ্তাহে নতুন রিমাইন্ডার পাঠাবে না */
      if(contributionState(m)==='PENDING_VERIFICATION') return;

      let s2 = st;
      if(!s2){
        s2 = db.duesReminders[m.id] = { lastSent: 0, lastCount: 0 };
        changed = true;
      }
      const last = Number(s2.lastSent) || 0;
      if(last && (now.getTime() - last) < WEEK_MS) return; /* ৭ দিনে একবার */

      const weekTag = Math.floor(now.getTime() / WEEK_MS);
      const key = 'dues-week-'+m.id+'-'+weekTag;
      const title = 'মাসিক চাঁদা বকেয়া';
      const body = info.count===1
        ? ('আপনার '+ (info.months[0]||'') +' মাসের চাঁদা বকেয়া রয়েছে। অনুগ্রহ করে পরিশোধ করুন।')
        : ('আপনার '+ bnNum(info.count) +' মাসের মাসিক চাঁদা বকেয়া রয়েছে ('+ info.months.join(', ') +')। অনুগ্রহ করে সম্পূর্ণ বকেয়া পরিশোধ করুন।');

      if(typeof notifyMember==='function'){
        notifyMember(m.id, title, body, 'payment', null, key);
      } else {
        if(!db.notifications.some(n=>n.dedupe===key)){
          db.notifications.unshift({ id: Date.now()+Math.floor(Math.random()*1000), to:m.id, title, body,
            type:'payment', refId:null, perm:null, by:null, dedupe:key, readBy:{}, createdAt:now.getTime() });
          if(db.notifications.length > 600) db.notifications = db.notifications.slice(0, 600);
        }
      }
      s2.lastSent = now.getTime();
      s2.lastCount = info.count;
      changed = true;
    });

    /* —— ২) অ্যাডমিন/সুপার অ্যাডমিন — প্রতি মাসে একবার সারসংক্ষেপ —— */
    const activeMembers = db.members.filter(x=>x.role==='member' && x.status==='ACTIVE');
    let unpaidThisMonth = 0, anyDues = 0;
    activeMembers.forEach(m=>{
      const info = duesOverdueInfo(m, now);
      if(info.count>0) anyDues++;
      if(info.months && info.months.indexOf(monName)>-1) unpaidThisMonth++;
    });
    const adminKey = 'dues-admin-month-'+monthKey;
    if((unpaidThisMonth>0 || anyDues>0) && !db.notifications.some(n=>n.dedupe===adminKey)){
      const title = 'মাসিক চাঁদা — '+ monName +' সারসংক্ষেপ';
      const body = monName +' মাসে '+ bnNum(unpaidThisMonth) +' জন সদস্য চাঁদা পরিশোধ করেননি। মোট '+ bnNum(anyDues) +' জনের চাঁদা বকেয়া রয়েছে।';
      if(typeof notifyAdmins==='function'){
        notifyAdmins(title, body, 'payment', null, null, adminKey);
      } else {
        db.notifications.unshift({ id: Date.now()+Math.floor(Math.random()*999), to:'admin', title, body,
          type:'payment', refId:null, perm:null, by:null, dedupe:adminKey, readBy:{}, createdAt:now.getTime() });
      }
      changed = true;
    }

    if(changed) saveDB();
  }catch(e){ console.warn('dues automation', e); }
}

function approvePayment(id){
  const p = db.payments.find(x=>x.id===id);
  p.status='approved';
  const m = getMember(p.member);
  if(m){
    if(!Array.isArray(m.paidMonths)) m.paidMonths=[];
    (p.months||[]).forEach(month=>{if(!m.paidMonths.includes(month))m.paidMonths.push(month);});
    m.contribution=m.paidMonths.length>=12?'PAID':'DUE';
  }
  addAudit(`পেমেন্ট অনুমোদন করেছেন`, `${p.id} · ${p.memberName}`);
  notifyAdmins('পেমেন্ট অনুমোদিত', `${currentMember().name} — ${p.memberName}-এর পেমেন্ট অনুমোদন করেছেন`, 'payment', null, 'payment.verify');
  if(m) notifyMember(m.id, 'পেমেন্ট অনুমোদিত', `আপনার পেমেন্ট (${p.offer||''}) অনুমোদিত হয়েছে।`, 'payment');
  saveDB(); render(); toast('পেমেন্ট অনুমোদিত হয়েছে','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l5 5L20 7"/></svg>');
}

  const p = db.payments.find(x=>x.id===id); p.status='rejected';

  const mobile=document.getElementById('bnMobile').value.trim().replace(/[\s-]/g,'');
  if(!patient){ toast('রোগীর নাম দিন','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'); return; }
  if(!mobile || mobile.length<10){ toast('সঠিক মোবাইল নম্বর দিন','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'); return; }

function bloodCompletionSummaryHTML(r){

}

function refreshBloodCompletionRows(){
  const rows = document.querySelectorAll('#bcRows .bc-row');

function addBloodCompletionRow(){
  const wrap = document.getElementById('bcRows'); if(!wrap) return;

  const row = btn.closest('.bc-row'); if(row) row.remove();

function submitBloodCompletion(id){
  const warn = '<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>';
  if(session.role!=='superadmin'){ toast('শুধু সুপার এডমিন এটি করতে পারবেন', warn); return; }
  const r = db.bloodRequests.find(x=>x.id===id);
  if(!r || r.status!=='active' || r.completion){ toast('এই অনুরোধটি সম্পন্ন করা যাবে না', warn); return; }
  const donors = []; const seen = new Set();
  const rows = Array.from(document.querySelectorAll('#bcRows .bc-row'));
  for(const row of rows){
    const mid = row.querySelector('.bc-member').value;
    const bagsRaw = row.querySelector('.bc-bags').value;
    if(!mid){
      if(bagsRaw){ toast('রক্তদাতা সদস্য নির্বাচন করুন', warn); return; }
      continue; /* খালি সারি উপেক্ষা */
    }
    const bags = Number(bagsRaw);
    if(![1,2,3].includes(bags)){ toast('কত ব্যাগ রক্ত দিয়েছেন তা নির্বাচন করুন', warn); return; }
    if(seen.has(mid)){ toast('একই সদস্যকে দুইবার নির্বাচন করা যাবে না', warn); return; }
    const m = getMember(mid);
    if(!m){ toast('সদস্য পাওয়া যায়নি', warn); return; }
    seen.add(mid);
    donors.push({memberId:mid, name:m.name, bags});
  }
  if(donors.length>3){ toast('সর্বোচ্চ ৩ জন সদস্য নির্বাচন করা যাবে', warn); return; }
  const outName = document.getElementById('bcOutName').value.trim();
  const outBagsRaw = bnDigitsToEn(document.getElementById('bcOutBags').value.trim());
  const outsideDonors = [];
  if(outName || outBagsRaw){
    if(!outName){ toast('বাইরের রক্তদাতার নাম লিখুন', warn); return; }
    if(!/^[0-9]+$/.test(outBagsRaw) || Number(outBagsRaw)<1){ toast('কত ব্যাগ রক্ত দিয়েছেন তা সংখ্যায় লিখুন', warn); return; }
    outsideDonors.push({name:outName, bags:Number(outBagsRaw)});
  }
  if(!donors.length && !outsideDonors.length){ toast('কমপক্ষে একজন রক্তদাতার তথ্য দিন', warn); return; }
  const totalBags = donors.reduce((a,d)=>a+d.bags,0) + outsideDonors.reduce((a,d)=>a+d.bags,0);
  const me = currentMember();
  r.completion = {completedAt:Date.now(), completedBy:{id:me?me.id:null, name:me?me.name:''}, donors, outsideDonors, totalBags};
  r.status = 'closed';
  addAudit('রক্তদানের অনুরোধ সম্পন্ন করেছেন', r.patient);
  notifyBloodGroup(r.bg,'রক্তের প্রয়োজন পূরণ হয়েছে',`${r.patient} — আর রক্তের প্রয়োজন নেই`);
  notifyAdmins('রক্তের অনুরোধ সম্পন্ন', `${r.patient} (${r.bg}) — মোট ${totalBags} ব্যাগ`, 'blood');
  saveDB(); closeModal(); render(); toast('রক্তদানের অনুরোধ সম্পন্ন হয়েছে','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5S19 10.2 19 15a7 7 0 11-14 0C5 10.2 12 2.5 12 2.5z"/></svg>');
}

function sendPushFromAdmin(){
  var title = (document.getElementById('pushTitle')||{}).value || '';
  var body = (document.getElementById('pushBody')||{}).value || '';
  var target = (document.getElementById('pushTarget')||{}).value || 'all';
  var bg = (document.getElementById('pushBlood')||{}).value || '';
  if(!title.trim()){ toast('শিরোনাম লিখুন',''); return; }
  if(target==='blood' && !bg){ toast('রক্তের গ্রুপ বাছুন',''); return; }
  // in-app notification
  if(target==='all') notifyAll(title, body, 'general');
  else if(target==='admins') notifyAdmins(title, body, 'general');
  else if(target==='superadmins') notifySuperAdmins(title, body, 'general');
  else if(target==='blood') notifyBloodGroup(bg, title, body);

  try{ document.getElementById('pushTitle').value=''; document.getElementById('pushBody').value=''; }catch(e){}
}

function acceptPwReset(reqId){

function likeAvatarsHTML(r){
  const likerIds = r.likes||[];

  const likers = likerIds.map(mid=>getMember(mid)).filter(Boolean);

  const sample = [...likers].sort(()=>Math.random()-0.5).slice(0, Math.min(3, likers.length));
  return `<div class="news-like-avatars" onclick="showLikers(${r.id})">
    ${sample.map(m=>`<div class="mini-av">${avatarInner(m)}</div>`).join('')}

function openCreateReport(){
  openModal(`
    <div class="modal-title"><h3><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> নতুন প্রতিবেদন</h3><button onclick="closeModal()"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <label class="field"><span>শিরোনাম</span><input id="rpTitle" placeholder="প্রতিবেদনের শিরোনাম"></label>
    <label class="field"><span>বিস্তারিত</span><textarea id="rpBody" placeholder="প্রতিবেদনের বিস্তারিত লিখুন"></textarea></label>
    <button class="btn btn-red" onclick="submitReport()">প্রকাশ করুন</button>
  `);
}
async function submitReport(){
  if(session.role!=='superadmin') return;
  const title = document.getElementById('rpTitle').value.trim();
  const body = document.getElementById('rpBody').value.trim();
  if(!title||!body){ toast('শিরোনাম ও বিস্তারিত দিন','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'); return; }
  if(!db.reports) db.reports=[];
  db.reports.unshift({id:Date.now(), title, body, date:Date.now(), by: currentMember()?currentMember().name:'সুপার অ্যাডমিন', likes:[]});
  addAudit('নতুন প্রতিবেদন যোগ করেছেন', title);
  notifyAll('নতুন প্রতিবেদন', title, 'report');
  closeModal(); render(); toast('প্রতিবেদন প্রকাশিত হয়েছে','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l5 5L20 7"/></svg>');
  await saveDB();
}

/* ---------------- INIT ---------------- */
window.onload = async function(){
  session = loadSession();
  let localData = null;
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) localData = JSON.parse(raw); }catch(e){}
  const cloudData = await loadDBFromCloud();
  if(cloudData && (!localData || (cloudData.updatedAt||0) >= (localData.updatedAt||0))){
    db = cloudData;
    localStorage.setItem(LS_KEY, JSON.stringify(db));
  } else if(localData){
    db = localData;
    if(!cloudLoadFailed) saveDBToCloud();   /* ক্লাউড থেকে পড়া ব্যর্থ হলে পুরোনো লোকাল ডাটা দিয়ে ক্লাউড ওভাররাইট করা হয় না */
  } else {
    db = loadDB();
    if(!cloudLoadFailed) saveDBToCloud();   /* ক্লাউড পড়া ব্যর্থ হলে ডেমো ডাটা দিয়ে আসল ডাটা মুছে ফেলা হয় না */
  }
  if(!db.reports) db.reports = [];
  if(!db.notifications) db.notifications = [];
  ensurePointRules();
  validatePersistedSession(!!cloudData);
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    let rid = null;
    if(location.hash && location.hash.indexOf('report=')>-1){
      rid = location.hash.split('report=')[1];
    } else {
      rid = new URLSearchParams(location.search).get('report');
    }
    if(rid){
      session.screen = 'reports';
      session.focusReportId = Number(rid);
      const r = db.reports.find(x=>x.id===session.focusReportId);
      if(r){
        document.title = `${r.title} | উদার আত্মা সংগঠন`;
        const setMeta = (sel, val)=>{ const el=document.querySelector(sel); if(el) el.setAttribute('content', val); };
        setMeta('meta[property="og:title"]', r.title);
        setMeta('meta[property="og:description"]', r.body.slice(0,160));
        setMeta('meta[name="twitter:title"]', r.title);
        setMeta('meta[name="twitter:description"]', r.body.slice(0,160));
      }
    }
  }catch(e){}
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('shell').style.display='flex';
    document.getElementById('shell').style.flexDirection='column';
    render(); afterLoginNotify();
  }, 1300);
  startRealtimeSync();
  // FCM / Native পুশ নোটিফিকেশন চালু
  // Capacitor অ্যাপে native FCM, ব্রাউজারে web FCM
  if (typeof initNativePush === 'function') {
    initNativePush().then(function(isNative) {
      if (!isNative) {
        initFCM();
        setTimeout(function(){ requestFCMPermissionAndToken(); }, 1500);
      }
    });
  } else {
    initFCM();
    setTimeout(function(){ requestFCMPermissionAndToken(); }, 2000);
  }
};

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    // FCM service worker প্রাধান্য — sw.js আর আলাদা রেজিস্টার করা হচ্ছে না
    navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
      .catch(e=>console.warn('FCM SW register failed', e));
  });
}
</script>
<script>
/* UDAR ATMA — presentation-only motion layer. Reads the DOM, never touches app data or logic. */
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  var sp=document.getElementById('splash');
  if(sp&&!reduce){
    var c=document.createElement('canvas');c.className='sp-canvas';sp.insertBefore(c,sp.firstChild);
    var x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W=c.width=sp.clientWidth*dpr,H=c.height=sp.clientHeight*dpr,P=[],N=W<900*dpr?32:52,i;
    for(i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.5+.6)*dpr,v:(Math.random()*.3+.1)*dpr,red:Math.random()<.2});
    (function loop(){
      if(!document.body.contains(sp)||getComputedStyle(sp).display==='none')return;
      x.clearRect(0,0,W,H);
      P.forEach(function(p){p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
        x.fillStyle=p.red?'rgba(227,28,36,.85)':'rgba(255,255,255,.35)';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();});
      requestAnimationFrame(loop);
    })();
  }
  var shell=document.getElementById('shell');
  if(!shell)return;
  /* scroll-aware topbar shadow */
  var tick=false;
  addEventListener('scroll',function(){if(tick)return;tick=true;requestAnimationFrame(function(){document.body.classList.toggle('scrolled',scrollY>8);tick=false;});},{passive:true});
  /* staggered scroll reveal */
  var SEL='.card,.notice-card,.donor-card,.stat-box,.offer-card,.action-row,.section-title,.point-tri,.news-card,.mcard-wrap,.list-item';
  if('IntersectionObserver' in window&&!reduce){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting)return;
        io.unobserve(e.target);
        var t=e.target;
        requestAnimationFrame(function(){t.classList.add('in');});
        setTimeout(function(){t.classList.remove('rv','in');t.style.removeProperty('--d');},1000);
      });
    },{threshold:.08,rootMargin:'0px 0px -6% 0px'});
    var scan=function(){
      var n=0;
      shell.querySelectorAll(SEL).forEach(function(el){
        if(el.dataset.rv||el.closest('.modal-back'))return;
        el.dataset.rv='1';el.classList.add('rv');el.style.setProperty('--d',Math.min(n++,8)*55+'ms');io.observe(el);
      });
    };
    new MutationObserver(function(){scan();}).observe(shell,{childList:true,subtree:true});
    scan();
  }
  /* ripple origin (CSS draws it) */
  document.addEventListener('pointerdown',function(e){
    var b=e.target.closest&&e.target.closest('.btn,.chip,.navbtn');if(!b)return;
    var r=b.getBoundingClientRect();
    b.style.setProperty('--rx',(e.clientX-r.left)+'px');b.style.setProperty('--ry',(e.clientY-r.top)+'px');
    b.classList.remove('rip');void b.offsetWidth;b.classList.add('rip');
  },{passive:true});
  /* hero spotlight + subtle membership-card tilt (pointer devices only) */
  if(fine&&!reduce){
    shell.addEventListener('pointermove',function(e){
      var h=e.target.closest&&e.target.closest('.hero-card');
      if(h){var r=h.getBoundingClientRect();h.style.setProperty('--mx',(e.clientX-r.left)+'px');h.style.setProperty('--my',(e.clientY-r.top)+'px');}
      var w=e.target.closest&&e.target.closest('.mcard-wrap');
      if(w){var q=w.getBoundingClientRect(),px=(e.clientX-q.left)/q.width-.5,py=(e.clientY-q.top)/q.height-.5;
        w.style.transform='rotateX('+(-py*6)+'deg) rotateY('+(px*8)+'deg)';}
    });
    shell.addEventListener('pointerout',function(e){var w=e.target.closest&&e.target.closest('.mcard-wrap');if(w)w.style.transform='';});
    /* magnetic primary buttons */
    shell.addEventListener('pointermove',function(e){
      var b=e.target.closest&&e.target.closest('.btn:not(.btn-sm)');
      if(!b)return;var r=b.getBoundingClientRect();
      b.style.translate=((e.clientX-r.left-r.width/2)*.04)+'px '+((e.clientY-r.top-r.height/2)*.12)+'px';
    });
    shell.addEventListener('pointerout',function(e){var b=e.target.closest&&e.target.closest('.btn');if(b)b.style.translate='';});
  }
})();
</script>
