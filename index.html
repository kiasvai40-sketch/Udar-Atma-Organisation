<style>
/* ===== UDAR ATMA — Premium Typography System =====
   Hierarchy (most premium vibe):
   • Brand / Org name ("উদার আত্মা সংগঠন") → Noto Serif Bengali (unchanged, do not alter text)
   • Headings (h1–h3, section, news, modal, display) → Noto Serif Bengali (elegant, trustworthy)
   • Body / UI / buttons / labels / inputs / list text → Anek Bangla + Hind Siliguri (modern, highly readable)
   • Numbers / stats / ranks → Hind Siliguri + tabular-nums (precise)
   • English Latin → system-ui
   Navy #0F0F54 + Red #E31C24. Selectors unchanged; visuals rebuilt. */
:root{
  --navy:#0F0F54;--navy-2:#0F0F54;--navy-3:#0F0F54;--navy-deep:#0F0F54;
  --navy-soft:#ECECF6;
  --red:#E31C24;--red-2:#E31C24;--red-deep:#E31C24;
  --bg:#F3F3F8;--surface:#FFFFFF;--ink:#12123A;--muted:#62627E;--border:#E1E1EC;
  --success:#178A54;--success-bg:#E7F6EE;--warning:#B6720A;--warning-bg:#FCF1DF;--danger-bg:#FCEAEA;
  --gold:#E31C24;--gold-2:#E31C24;
  --r-lg:12px;--r-md:8px;--r-sm:6px;
  --shadow-sm:0 1px 2px rgba(15,15,84,.06);
  --shadow-md:0 10px 28px rgba(15,15,84,.12);
  --shadow-lg:0 28px 56px rgba(15,15,84,.20);
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --shell-max:100%;
  --lattice:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:'Anek Bangla','Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;letter-spacing:.15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
h1,h2,h3,.display{font-family:'Noto Serif Bengali','Anek Bangla',serif;letter-spacing:.02em;font-weight:700;}
button{font-family:inherit;}
img{max-width:100%;display:block;}
::-webkit-scrollbar{display:none;}
::selection{background:var(--red);color:#fff;}

/* SHELL */
#shell{width:100%;max-width:var(--shell-max);margin:0 auto;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;}
@media (min-width:481px){
  body{background:var(--navy);background-image:var(--lattice),radial-gradient(circle at 15% 10%,rgba(227,28,36,.18),transparent 40%);}
  #shell{min-height:100vh;box-shadow:0 0 0 1px rgba(255,255,255,.08),var(--shadow-lg);}
}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:999;background:var(--navy);background-image:var(--lattice);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#fff;padding-top:var(--safe-t);padding-bottom:var(--safe-b);overflow:hidden;}
#splash>*{position:relative;z-index:1;}
#splash .sp-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
#splash .logo-ring{position:relative;width:min(42vw,168px);aspect-ratio:1;height:auto;border-radius:22%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:visible;animation:splashIn 1s var(--ease) both;box-shadow:0 8px 28px rgba(0,0,0,.25);}
#splash .logo-ring:before{content:none;display:none;}
#splash .logo-ring:after{content:"";position:absolute;inset:-8px;border-radius:26%;border:2px solid rgba(255,255,255,.5);pointer-events:none;animation:splashBorderPulse 2.4s ease-in-out infinite;}
#splash .logo-ring img{width:92%;height:92%;object-fit:contain;object-position:center;border-radius:16%;background:#fff;display:block;}
@keyframes splashIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:none;}}
@keyframes splashBorderPulse{0%,100%{opacity:.4;border-color:rgba(255,255,255,.35);}50%{opacity:1;border-color:rgba(255,255,255,.85);}}
#splash h1{margin:10px 0 0;font-size:26px;font-weight:800;animation:fadeUp .8s .25s var(--ease) both;text-align:center;}
#splash p{margin:0;opacity:.7;font-size:11px;letter-spacing:5px;animation:fadeUp .8s .4s var(--ease) both;}
#splash .bar{width:120px;height:2px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:10px;}
#splash .bar i{display:block;height:100%;width:40%;background:var(--red);animation:load 1.1s ease-in-out infinite;}
@keyframes load{0%{transform:translateX(-120%);}100%{transform:translateX(280%);}}
@media (prefers-reduced-motion:reduce){
  #splash .logo-ring:after{animation:none;opacity:.7;}
}


/* TOPBAR */
.topbar{padding:calc(14px + var(--safe-t)) 18px 22px;background:var(--navy);background-image:var(--lattice);color:#fff;position:sticky;top:0;z-index:20;transition:box-shadow .3s ease;}
.topbar:after{content:"";position:absolute;left:18px;bottom:0;width:56px;height:3px;background:var(--red);}
.scrolled .topbar{box-shadow:0 10px 30px rgba(15,15,84,.35);}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand-mini{display:flex;align-items:center;gap:12px;}
.brand-mini .mark{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.brand-mini .mark span{font-family:'Noto Serif Bengali','Anek Bangla',serif;font-weight:800;color:var(--navy);font-size:14px;}
.brand-mini .brand-en{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:2px;}
.brand-mini .brand-en b,
.brand-mini b.brand-en-name{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:12.5px;
  font-weight:800;
  letter-spacing:.08em;
  line-height:1.22;
  display:block;
  color:#fff;
  text-transform:uppercase;
}
.brand-mini small{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:8.5px;
  font-weight:600;
  opacity:.68;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-top:2px;
  display:block;
  line-height:1.2;
}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative;transition:transform .2s var(--ease),background-color .2s ease,border-color .2s ease;}
.icon-btn:hover{background:var(--red);border-color:var(--red);}
.icon-btn:active{transform:scale(.88);}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--navy);animation:dotPulse 1.8s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}
.topbar h2{margin:20px 0 2px;font-size:27px;font-weight:800;line-height:1.15;letter-spacing:0;}
.topbar .sub{font-size:12.5px;opacity:.72;margin:0;}

/* CONTENT */
#content{flex:1;padding:18px 16px calc(104px + var(--safe-b));min-height:0;}
.screen{animation:fadeUp .5s var(--ease) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* SECTIONS & CARDS */
.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px;}
.section-title h3{font-size:16.5px;margin:0;color:var(--navy);font-weight:800;display:flex;align-items:center;gap:9px;}
.section-title h3:before{display:none;}
.section-title a{font-size:12.5px;color:var(--red);text-decoration:none;font-weight:700;}
.card,.notice-card,.donor-card,.stat-box,.offer-card,.action-row{background-color:var(--surface);background-image:linear-gradient(var(--red),var(--red));background-repeat:no-repeat;background-position:0 0;background-size:0 2px;border:1px solid var(--border);transition:background-size .45s var(--ease),box-shadow .3s ease,border-color .3s ease;}
.card:hover,.notice-card:hover,.donor-card:hover,.stat-box:hover,.offer-card:hover,.action-row:hover{background-size:44px 2px;box-shadow:var(--shadow-md);border-color:#CFCFE2;}
.card{border-radius:var(--r-lg);padding:17px;}
.card + .card{margin-top:10px;}
.hero-card{border-radius:4px 22px 4px 4px;padding:28px 22px 26px;background:var(--navy);background-image:var(--lattice);color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-md);--mx:85%;--my:0%;}
.hero-card:before{content:"";position:absolute;left:0;top:0;width:4px;height:56px;background:var(--red);}
.hero-card:after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(227,28,36,.38),transparent 65%);pointer-events:none;transition:background .2s ease;}
.hero-card h2{margin:0 0 9px;font-size:24px;font-weight:800;line-height:1.25;position:relative;z-index:1;}
.hero-card p{margin:0;font-size:13px;opacity:.85;line-height:1.75;position:relative;z-index:1;max-width:92%;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.2px;}
.pill-public{background:var(--navy-soft);color:var(--navy);}
.pill-members{background:var(--navy);color:#fff;}
.pill-admin{background:#FCE9EE;color:var(--red);}
.pill-normal{background:#EFEFF7;color:var(--muted);}
.pill-important{background:var(--warning-bg);color:var(--warning);}
.pill-urgent{background:#FFE3D6;color:#C2440A;}
.pill-emergency{background:var(--red);color:#fff;animation:pulseGlow 1.8s ease-in-out infinite;}
.pill-success{background:var(--success-bg);color:var(--success);}
.pill-danger{background:var(--danger-bg);color:var(--red);}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(227,28,36,.4);}50%{box-shadow:0 0 0 6px rgba(227,28,36,0);}}

.list-item{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);transition:background-color .2s ease,padding .3s var(--ease);}
.list-item:last-child{border-bottom:none;}
.list-item:hover{background-color:#F8F8FC;padding-left:8px;}
.list-item .ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--navy-soft);color:var(--navy);overflow:hidden;}
.list-item .meta{flex:1;min-width:0;}
.list-item .meta b{font-size:14px;display:block;margin-bottom:2px;}
.list-item .meta span{font-size:12px;color:var(--muted);}
.list-item .tail{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.notice-card{border-radius:var(--r-md);padding:15px;margin-bottom:10px;}
.notice-card .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.notice-card h4{margin:7px 0 4px;font-size:15px;color:var(--navy);}
.notice-card p{margin:0;font-size:12.8px;color:var(--muted);line-height:1.65;}
.notice-card .foot{margin-top:9px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;}

/* CHIPS / BUTTONS */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:4px;scrollbar-width:none;}
.chip{flex-shrink:0;padding:8px 15px;border-radius:4px;background:#fff;border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative;overflow:hidden;transition:transform .2s var(--ease),background-color .25s ease,color .25s ease,border-color .25s ease;}
.chip:hover{border-color:var(--red);color:var(--navy);}
.chip:active{transform:scale(.95);}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 -2px 0 var(--red);}
.btn{position:relative;overflow:hidden;border:none;border-radius:var(--r-md);padding:14px 16px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .2s var(--ease),box-shadow .3s ease,background-size .45s var(--ease),color .3s ease;background-repeat:no-repeat;background-position:left center;background-size:0% 100%;}
.btn:after{content:"";position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);opacity:0;pointer-events:none;}
.btn.rip:after,.chip.rip:after,.navbtn.rip:after{animation:ripple .6s ease-out;}
@keyframes ripple{from{transform:scale(0);opacity:.9;}to{transform:scale(34);opacity:0;}}
.btn:active{transform:scale(.97);}
.btn-primary{background-color:var(--navy);background-image:linear-gradient(var(--red),var(--red));color:#fff;box-shadow:0 8px 20px rgba(15,15,84,.28);}
.btn-primary:hover{background-size:100% 100%;}
.btn-red{background-color:var(--red);background-image:linear-gradient(var(--navy),var(--navy));color:#fff;box-shadow:0 8px 20px rgba(227,28,36,.30);}
.btn-red:hover{background-size:100% 100%;}
.btn-outline{background-color:#fff;background-image:linear-gradient(var(--navy),var(--navy));color:var(--navy);border:1.5px solid var(--navy);}
.btn-outline:hover{background-size:100% 100%;color:#fff;}
.btn-ghost{background-color:var(--navy-soft);color:var(--navy);}
.btn-ghost:hover{background-color:#DFDFF0;}
.btn-sm{width:auto;padding:9px 14px;font-size:12.5px;border-radius:6px;}
.btn-danger-outline{background-color:#fff;color:var(--red);border:1.5px solid #F1B9C4;}
.btn-danger-outline:hover{background-color:var(--danger-bg);}
.btn[disabled]{opacity:.5;pointer-events:none;}
.btn-row{display:flex;gap:9px;}
.btn-row .btn{flex:1;}

/* FORMS */
label.field{display:block;margin-bottom:14px;}
label.field span{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px;letter-spacing:.3px;}
input,textarea,select{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:13px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);transition:border-color .2s ease,box-shadow .25s var(--ease);}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 3px 0 -1px var(--red);}
textarea{resize:vertical;min-height:84px;}
.pin-boxes{display:flex;gap:9px;justify-content:center;margin:6px 0 2px;}
.pin-boxes input{width:44px;height:54px;text-align:center;font-size:20px;font-weight:700;padding:0;letter-spacing:0;}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-box{border-radius:var(--r-md);padding:15px;cursor:pointer;}
.stat-box b{display:block;font-size:26px;font-family:'Hind Siliguri','Anek Bangla',sans-serif;color:var(--navy);line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-box span{font-size:11.5px;color:var(--muted);}
.stat-box:active{transform:scale(.96);}
.stat-box.accent{background-color:var(--red);background-image:none;border:none;box-shadow:0 10px 22px rgba(227,28,36,.26);}
.stat-box.accent b,.stat-box.accent span{color:#fff;}
.action-row{display:flex;align-items:center;gap:12px;border-radius:var(--r-md);padding:12px;margin-bottom:8px;cursor:pointer;}
.action-row .count{width:32px;height:32px;border-radius:6px;background:var(--red);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.action-row .txt{flex:1;font-size:13.5px;font-weight:600;}
.action-row .arrow{color:var(--muted);transition:transform .3s var(--ease),color .3s ease;}
.action-row:hover .arrow{transform:translateX(4px);color:var(--red);}

/* MEMBERSHIP CARD (3D) */
.mcard-wrap{perspective:1200px;margin:6px 0 4px;}
.mcard{position:relative;width:100%;aspect-ratio:1.586/1;border-radius:16px;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer;}
.mcard.flipped{transform:rotateY(180deg);}
.mcard-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px;color:#fff;background:var(--navy);background-image:var(--lattice);overflow:hidden;box-shadow:var(--shadow-lg);}
.mcard-face:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%);background-size:220% 220%;animation:shine 5s linear infinite;pointer-events:none;}
.mcard-face:after{content:"";position:absolute;right:-30px;top:-10px;width:90px;height:220%;background:var(--red);transform:rotate(24deg);opacity:.9;z-index:0;}
.mcard-face>*{position:relative;z-index:1;}
@keyframes shine{0%{background-position:160% 0;}100%{background-position:-60% 0;}}
.mcard-face.back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.mcard-top{display:flex;justify-content:space-between;align-items:flex-start;}
.mcard-top .org{font-size:11px;opacity:.9;line-height:1.4;}
.mcard-top .mark2{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mcard-top .mark2 span{font-family:'Noto Serif Bengali','Anek Bangla',serif;font-weight:800;color:var(--navy);font-size:12px;}
.mcard-mid{display:flex;gap:12px;align-items:center;margin-top:20px;}
.mcard-mid .photo{width:54px;height:54px;border-radius:10px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.mcard-mid .info b{font-size:15.5px;display:block;}
.mcard-mid .info span{font-size:11.5px;opacity:.88;}
.mcard-bot{display:flex;justify-content:space-between;align-items:flex-end;position:absolute;bottom:16px;left:18px;right:18px;font-size:10.5px;opacity:.92;}
.mcard-bot b{display:block;font-size:12px;}
.qr-box{width:110px;height:110px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;}

/* POINTS */
.point-tri{display:flex;gap:8px;margin:14px 0 4px;}
.point-tri div{flex:1;text-align:center;border-radius:var(--r-md);padding:13px 6px;border:1px solid transparent;}
.point-tri .plus{background:var(--success-bg);}
.point-tri .minus{background:var(--danger-bg);}
.point-tri .final{background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--red);}
.point-tri b{display:block;font-size:21px;font-family:'Hind Siliguri','Anek Bangla',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;}
.point-tri .plus b{color:var(--success);}
.point-tri .minus b{color:var(--red);}
.point-tri span{font-size:10.5px;color:var(--muted);}
.point-tri .final span{color:rgba(255,255,255,.8);}
.offer-card{border-radius:var(--r-md);padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.offer-card.best{border-color:var(--red);background-color:#FFF6F6;}
.offer-card b{font-size:15px;display:block;}
.offer-card span{font-size:12px;color:var(--muted);}

/* BOTTOM DOCK */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));width:calc(100% - 20px);max-width:calc(var(--shell-max) - 20px);background:var(--navy);background-image:var(--lattice);border-radius:16px;display:flex;padding:6px;z-index:30;box-shadow:0 18px 40px rgba(15,15,84,.45),0 0 0 1px rgba(255,255,255,.08);animation:dockIn .7s .2s var(--ease) both;}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,30px);}to{opacity:1;transform:translate(-50%,0);}}
.navbtn{flex:1;position:relative;overflow:hidden;background:none;border:none;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;color:rgba(255,255,255,.55);font-size:10.5px;font-weight:600;cursor:pointer;transition:color .25s ease,transform .2s var(--ease),background-color .25s ease;}
.navbtn:after{content:"";position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);opacity:0;pointer-events:none;}
.navbtn:before{content:"";position:absolute;top:0;left:50%;width:22px;height:3px;background:var(--red);border-radius:0 0 3px 3px;transform:translateX(-50%) scaleX(0);transition:transform .4s var(--ease);}
.navbtn:hover{color:#fff;}
.navbtn:active{transform:scale(.92);}
.navbtn .ic{font-size:19px;transition:transform .35s var(--ease);}
.navbtn.active{color:#fff;background:rgba(255,255,255,.08);}
.navbtn.active:before{transform:translateX(-50%) scaleX(1);}
.navbtn.active .ic{animation:navPop .4s var(--ease);transform:translateY(-1px);}
@keyframes navPop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}

/* TOAST */
#toastwrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));max-width:calc(var(--shell-max) - 32px);width:calc(100% - 32px);z-index:400;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--navy);color:#fff;padding:13px 16px;border-radius:var(--r-md);border-left:4px solid var(--red);font-size:13px;box-shadow:0 16px 36px rgba(0,0,0,.35);animation:toastIn .45s var(--ease);display:flex;gap:8px;align-items:center;}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:none;}}

/* MODAL */
.modal-back{position:fixed;inset:0;background:rgba(10,10,50,.62);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-sheet{background:#fff;width:100%;max-width:var(--shell-max);border-radius:20px 20px 0 0;border-top:3px solid var(--red);padding:16px 18px calc(22px + var(--safe-b));max-height:88vh;overflow-y:auto;animation:sheetUp .5s var(--ease);box-shadow:0 -24px 60px rgba(15,15,84,.28);}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0;}to{transform:none;opacity:1;}}
.modal-handle{width:38px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 14px;}
.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-title h3{margin:0;font-size:18px;font-weight:800;color:var(--navy);}
.modal-title button{background:var(--navy-soft);border:none;width:32px;height:32px;border-radius:8px;font-size:15px;cursor:pointer;color:var(--navy);transition:background-color .2s ease,color .2s ease,transform .3s var(--ease);display:inline-flex;align-items:center;justify-content:center;padding:0;}.modal-title button .svgi{width:14px;height:14px;}
.modal-title button:hover{background:var(--red);color:#fff;transform:rotate(90deg);}
.empty-state{text-align:center;padding:40px 10px;color:var(--muted);}
.empty-state .em{font-size:34px;margin-bottom:10px;display:flex;justify-content:center;align-items:center;color:var(--navy);opacity:.75;}
.empty-state p{font-size:13px;margin:0;}

/* SWITCH / TABS */
.switch{position:relative;width:46px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:#D3D3E4;border-radius:99px;transition:background-color .3s ease;cursor:pointer;}
.switch .track:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .35s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .track{background:var(--navy);}
.switch input:checked + .track:before{transform:translateX(20px);}
.switch input:focus-visible + .track{outline:2px solid var(--red);outline-offset:2px;}
.switch-row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--border);}
.switch-row:last-child{border-bottom:none;}
.switch-row b{font-size:13.5px;display:block;}
.switch-row span{font-size:11.5px;color:var(--muted);}
.tabs2{display:flex;background:var(--navy-soft);border-radius:var(--r-md);padding:4px;margin-bottom:14px;}
.tabs2 button{flex:1;border:none;background:none;padding:10px;border-radius:6px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;transition:background-color .25s ease,color .25s ease,box-shadow .25s ease;}
.tabs2 button.active{background:var(--navy);color:#fff;box-shadow:inset 0 -2px 0 var(--red);}

/* AUTH */
.auth-wrap{padding:28px 22px calc(30px + var(--safe-b));min-height:100%;background:var(--navy);background-image:var(--lattice);position:relative;}
.auth-wrap:after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(100% - 270px);background:var(--bg);z-index:0;clip-path:polygon(0 18px,100% 0,100% 100%,0 100%);}
.auth-wrap>*{position:relative;z-index:1;}
.auth-logo{width:82px;height:82px;border-radius:50%;background:#fff;margin:10px auto 16px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 5px rgba(255,255,255,.14);animation:splashIn .9s var(--ease) both;}
.auth-logo span{font-family:'Noto Serif Bengali','Anek Bangla',serif;font-weight:800;color:var(--navy);font-size:24px;}
.auth-head{text-align:center;color:#fff;margin-bottom:26px;}
.auth-head h1{font-size:23px;font-weight:800;margin:0 0 5px;font-family:'Noto Serif Bengali','Anek Bangla',serif;letter-spacing:.02em;}
.auth-head p{font-size:11px;margin:0;opacity:.75;letter-spacing:4px;}
.auth-box{background:#fff;border-radius:var(--r-lg);border-top:3px solid var(--red);padding:22px 18px;box-shadow:var(--shadow-lg);}
.link-txt{text-align:center;font-size:13px;color:var(--muted);margin-top:14px;}
.link-txt b{color:var(--red);cursor:pointer;}
.link-txt b:hover{text-decoration:underline;}
.demo-box{margin-top:16px;border-top:1px dashed rgba(255,255,255,.3);padding-top:14px;}
.demo-box p{color:rgba(255,255,255,.75);font-size:11px;text-align:center;margin:0 0 10px;}
.demo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.demo-grid button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:10px 4px;font-size:11px;font-weight:700;cursor:pointer;transition:background-color .2s ease;}
.demo-grid button:hover{background:var(--red);border-color:var(--red);}
.role-badge{position:fixed;top:calc(6px + var(--safe-t));right:8px;z-index:25;background:rgba(0,0,0,.3);color:#fff;font-size:10px;padding:3px 9px;border-radius:99px;letter-spacing:.5px;}

/* REPORTS / NEWS */
.news-page{background:var(--bg);min-height:100%;}
.news-masthead{background:var(--navy);background-image:var(--lattice);color:#fff;padding:calc(12px + var(--safe-t)) 14px 13px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--red);}
.news-masthead>*{position:relative;z-index:1;}
.news-brand{display:flex;align-items:center;justify-content:center;gap:9px;flex:1;text-align:center;}
.news-brand img{width:30px;height:30px;border-radius:50%;object-fit:contain;background:#fff;flex-shrink:0;}
.news-brand b{display:block;font-family:'Noto Serif Bengali','Anek Bangla',serif;font-size:14.5px;line-height:1.15;font-weight:700;}
.news-brand span{display:block;font-size:10px;opacity:.75;letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
.news-body{padding:22px 18px calc(34px + 84px + var(--safe-b));max-width:720px;margin:0 auto;}
.news-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.news-share-btn,.news-like-btn{background:var(--navy-soft);color:var(--navy);border:none;padding:9px 15px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .2s var(--ease),background-color .25s ease,color .25s ease;}
.news-share-btn:hover,.news-like-btn:hover{background:var(--navy);color:#fff;}
.news-like-btn.liked{background:#FCEAEA;color:var(--red);}
.news-share-btn:active,.news-like-btn:active{transform:scale(.94);}
.news-like-avatars{display:flex;align-items:center;gap:0;margin-top:10px;cursor:pointer;}
.mini-av{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;margin-left:-8px;}
.mini-av:first-child{margin-left:0;}
.news-like-avatars .cnt{font-size:12px;color:var(--muted);margin-left:8px;}
.news-hero{padding-bottom:20px;margin-bottom:20px;border-bottom:3px double var(--navy);}
.news-hero .news-tag{display:inline-block;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:2px;margin-bottom:10px;text-transform:uppercase;}
.news-hero h1{font-family:'Noto Serif Bengali','Anek Bangla',serif;font-size:25px;line-height:1.35;color:var(--navy);margin-bottom:9px;font-weight:700;letter-spacing:.01em;}
.news-meta{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:9px;}
.news-hero p{font-size:14.5px;line-height:1.8;color:var(--ink);white-space:pre-line;}
.news-list{display:flex;flex-direction:column;}
.news-card{padding:16px 0;border-bottom:1px solid var(--border);}
.news-card:last-child{border-bottom:none;}
.news-card h3{font-family:'Noto Serif Bengali','Anek Bangla',serif;font-size:16.5px;color:var(--navy);margin-bottom:6px;line-height:1.4;font-weight:700;}
.news-card p{font-size:13.5px;line-height:1.7;color:var(--ink);white-space:pre-line;}

/* MISC */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.gallery-tile{aspect-ratio:1;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
.gallery-tile span.cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);color:#fff;font-size:10.5px;padding:16px 8px 6px;font-weight:600;}
.donor-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--border);transition:background-color .2s ease;}
.donor-row .bg{width:44px;height:44px;border-radius:10px;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.donor-card{border-radius:var(--r-lg);padding:16px;margin-bottom:12px;}
.donor-card-top{display:flex;align-items:center;gap:12px;cursor:pointer;padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed var(--border);}
.donor-card-top .bg{width:52px;height:52px;border-radius:10px;background:var(--red);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.donor-card-info{display:flex;flex-direction:column;gap:4px;min-width:0;}
.donor-card-info b{font-size:15px;color:var(--navy);}
.donor-card-info span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:5px;}
.donor-card-info span .svgi{width:14px;height:14px;flex-shrink:0;vertical-align:middle;}
.donor-card-actions{display:flex;gap:8px;}
.action-pill{flex:1;min-width:0;text-align:center;padding:10px 6px;border-radius:6px;font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:transform .2s var(--ease),filter .2s ease;display:inline-flex;align-items:center;justify-content:center;gap:5px;line-height:1.2;}
.action-pill .svgi{width:14px;height:14px;flex-shrink:0;vertical-align:middle;}
.action-pill:active{transform:scale(.95);}
.action-pill.ready{background:#E7F8EE;color:#1C9A57;}
.action-pill.ready.not-ready{background:#F1F1F6;color:var(--muted);}
.action-pill.call{background:var(--navy-soft);color:var(--navy);}
.action-pill.whatsapp{background:#E7F8EE;color:#1C9A57;}
.reason-warn{background:var(--warning-bg);color:var(--warning);font-size:12px;padding:10px 12px;border-radius:var(--r-sm);margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;}.reason-warn .svgi{width:16px;height:16px;margin-top:1px;flex-shrink:0;}
.member-detail-head{display:flex;gap:12px;align-items:center;margin-bottom:16px;}
.member-detail-head .av{width:56px;height:56px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;overflow:hidden;box-shadow:inset 0 -3px 0 var(--red);}
.audit-row{padding:11px 2px;border-bottom:1px solid var(--border);font-size:12.5px;}
.audit-row .who{font-weight:700;color:var(--navy);}
.audit-row .when{color:var(--muted);font-size:11px;margin-top:2px;}
.fine-print{font-size:11px;color:var(--muted);text-align:center;line-height:1.7;margin-top:18px;padding:0 6px;}
.notice-banner{background:var(--warning-bg);border:1px solid #F0D9AE;border-left:4px solid var(--warning);color:#7a4a06;font-size:11.5px;padding:10px 12px;border-radius:var(--r-sm);margin-bottom:14px;line-height:1.6;}
.spin{animation:spinAnim .8s linear infinite;display:inline-block;}
@keyframes spinAnim{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.badge-row{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px;}
.badge-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:4px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-gold{background:#FFF3D6;color:#8a6400;}
.badge-silver{background:#ECECF2;color:#54546b;}
.badge-bronze{background:#FBE6D8;color:#8a4b1a;}
.badge-red{background:var(--danger-bg);color:var(--red);}
.badge-navy{background:var(--navy-soft);color:var(--navy);}
.badge-green{background:var(--success-bg);color:var(--success);}
.leader-mini{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.leader-mini::-webkit-scrollbar{display:none;}
.leader-mini .lcard{flex-shrink:0;width:100px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow-sm);}
.leader-mini .lcard .rank{display:none;}
.leader-mini .lcard .av{width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 8px;overflow:hidden;font-size:16px;}
.leader-mini .lcard b{display:block;font-size:11.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.leader-mini .lcard span{font-size:10.5px;color:var(--muted);}

/* FOCUS + MOTION LAYER */
*:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px;}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:var(--d,0ms);}
.rv.in{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .rv{opacity:1;transform:none;}
  html{scroll-behavior:auto;}
}
/* ===== PREMIUM PASS 2 ===== */
h1,h2,h3,.display{font-family:'Noto Serif Bengali','Anek Bangla',serif;}
.stat-box b,.point-tri b{font-family:'Hind Siliguri','Anek Bangla',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;}
.topbar h2{font-size:25px;line-height:1.35;font-weight:700;}
.hero-card h2{font-size:23px;line-height:1.45;font-weight:700;}
.section-title h3,.modal-title h3,.news-card h3{font-weight:700;}
/* Branding: "উদার আত্মা সংগঠন" — Noto Serif Bengali (do not alter this text or its font) */
.brand-name,.auth-head h1,.news-brand b,.brand-mini .mark span,.mcard-top .mark2 span{font-family:'Noto Serif Bengali','Anek Bangla',serif;font-weight:700;letter-spacing:.02em;}
/* Org name — exact font from brand artwork */
.org-name-img{display:block;height:auto;width:auto;max-width:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;}
#splash .org-name-img{height:36px;width:auto;max-width:min(320px,86vw);margin:12px auto 0;animation:fadeUp .8s .25s var(--ease) both;}
.auth-head .org-name-img{height:32px;width:auto;max-width:min(280px,85vw);margin:0 auto 6px;}
.brand-mini .org-name-img{height:18px;width:auto;max-width:160px;}
.hero-card .org-name-img{height:34px;width:auto;max-width:min(300px,90%);margin-bottom:10px;}
.mcard-top .org-name-img,.mcard-top .org{height:14px;width:auto;max-width:140px;display:inline-block;}
.news-brand .org-name-img{height:18px;width:auto;max-width:180px;}
.brand-name.org-name-wrap{margin:0;padding:0;line-height:0;}

.svgi{width:1em;height:1em;display:inline-block;vertical-align:-0.18em;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;shape-rendering:geometricPrecision;}
.svgi-fill{fill:currentColor;stroke:none;}
.svgi-fill path{fill:currentColor;stroke:none;}
.navbtn .ic,.icon-btn{line-height:1;}
.navbtn .ic .svgi{width:22px;height:22px;display:block;vertical-align:0;stroke-width:1.9;}
.icon-btn .svgi{width:18px;height:18px;display:block;vertical-align:0;}
.list-item .ico .svgi,.ico .svgi{width:22px;height:22px;display:block;stroke-width:1.9;}
.toast .svgi{width:18px;height:18px;flex-shrink:0;}
.empty-state .em .svgi{width:40px;height:40px;margin:0 auto;display:block;opacity:.9;stroke-width:1.6;color:var(--navy);}
.section-title h3 .svgi{width:19px;height:19px;color:var(--red);stroke-width:2;}
/* Ranking numbers */
.list-item .ico.rank-ico{font-family:'Hind Siliguri','Anek Bangla',sans-serif;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;}
/* Green verified tick for top contributors */
.tick-verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--success-bg);color:var(--success);margin-left:3px;vertical-align:middle;}
.tick-verified .svgi{width:11px;height:11px;stroke-width:2.4;color:var(--success);}
/* Icon color matching semantic text */
.list-item .ico{color:var(--navy);}
.list-item .ico.success-ico{color:var(--success);background:var(--success-bg);}
.list-item .ico.warn-ico{color:var(--warning);background:var(--warning-bg);}
.meta span{color:var(--muted);}
.modal-title h3 .svgi{width:18px;height:18px;color:var(--red);margin-right:4px;}
.btn .svgi{width:16px;height:16px;margin-right:2px;}
.badge-chip .svgi{width:12px;height:12px;}
.news-like-btn .svgi{width:16px;height:16px;}
.news-share-btn .svgi{width:14px;height:14px;}
.gallery-tile .svgi{width:28px;height:28px;opacity:.9;}
.switch-row .svgi,.audit-row .svgi{width:16px;height:16px;}
.donor-card .svgi{width:18px;height:18px;}

.hero-card{min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;}
.hero-art{position:absolute;right:-60px;top:-40px;width:280px;height:280px;pointer-events:none;z-index:0;transform:translate3d(0,var(--py,0px),0);}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.hero-art .r1{transform-origin:140px 140px;animation:spinAnim 40s linear infinite;}
.hero-art .r2{transform-origin:140px 140px;animation:spinAnim 26s linear infinite reverse;}
.hero-art img{position:absolute;left:55px;top:55px;width:170px;height:170px;border-radius:0;object-fit:contain;opacity:.22;mix-blend-mode:luminosity;animation:heroFloat 7s ease-in-out infinite;}
@keyframes heroFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hero-card h2,.hero-card p{text-shadow:0 2px 14px rgba(15,15,84,.5);}
.screen{animation:scrIn .6s var(--ease) both;}
@keyframes scrIn{from{opacity:0;transform:translateY(16px);filter:blur(6px);}to{opacity:1;transform:none;filter:none;}}
#navsweep{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--red);z-index:500;transform:scaleX(0);transform-origin:left;pointer-events:none;opacity:0;}
#navsweep.go{animation:sweep .7s var(--ease);}
@keyframes sweep{0%{transform:scaleX(0);opacity:1;}70%{transform:scaleX(1);opacity:1;}100%{transform:scaleX(1);opacity:0;}}
.stat-box{position:relative;}
.stat-box:before{content:"";position:absolute;right:12px;top:12px;width:8px;height:8px;border:2px solid var(--red);border-radius:50%;opacity:.7;}
.stat-box.accent:before{border-color:#fff;}


/* ==========================================================================
   COMPLETE RESPONSIVE SYSTEM (full-width friendly)
   Mobile layout preserved; sides fill available width.
   ========================================================================== */

html,body{overflow-x:hidden;}
img,svg,video{max-width:100%;height:auto;}
#shell,.screen,.card,.modal-sheet,.hero-card{max-width:100%;}
input,textarea,select,button{max-width:100%;}

/* Mobile & default: full bleed width */
:root{ --shell-max:100%; }
#shell{width:100%;max-width:100%;margin:0;box-shadow:none;}

/* —— 600–767: still full width, slightly more padding —— */
@media (min-width:600px){
  #content{padding:20px 22px calc(110px + var(--safe-b));}
  .topbar{padding:calc(15px + var(--safe-t)) 22px 22px;}
  .topbar h2{font-size:clamp(24px, 4.5vw, 28px);}
  .hero-card{padding:30px 24px 28px;}
  .hero-card h2{font-size:clamp(22px, 4vw, 26px);}
  .card{padding:18px;}
  .stat-grid{gap:12px;}
  .stat-box b{font-size:clamp(24px, 5vw, 28px);}
  .bottomnav{
    width:calc(100% - 24px);
    max-width:none;
    left:50%;
    transform:translateX(-50%);
    border-radius:18px;
  }
  .modal-sheet{padding:18px 20px calc(22px + var(--safe-b));}
}

/* —— Tablet 768–1023: full width app, comfortable padding —— */
@media (min-width:768px){
  #content{padding:24px 28px calc(116px + var(--safe-b));}
  .topbar{padding:calc(16px + var(--safe-t)) 28px 24px;}
  .topbar h2{font-size:30px;}
  .topbar .sub{font-size:13px;}
  .brand-mini .mark{width:44px;height:44px;}
  .icon-btn{width:42px;height:42px;}
  .hero-card{padding:36px 32px 32px;border-radius:8px 28px 8px 8px;min-height:220px;}
  .hero-card h2{font-size:26px;}
  .hero-card p{font-size:14px;max-width:92%;line-height:1.85;}
  .section-title{margin:36px 0 14px;}
  .section-title h3{font-size:17.5px;}
  .stat-grid{grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;}
  .stat-box{padding:18px;}
  .stat-box b{font-size:30px;}
  .card{padding:20px 22px;border-radius:14px;}
  .list-item{padding:14px 8px;gap:14px;}
  .list-item .ico{width:46px;height:46px;}
  .chip{padding:9px 16px;font-size:13px;}
  .bottomnav{
    width:calc(100% - 32px);
    max-width:none;
    bottom:calc(14px + var(--safe-b));
    border-radius:18px;
    padding:7px;
  }
  .navbtn{padding:9px 3px 8px;font-size:11px;}
  .modal-sheet{border-radius:22px 22px 0 0;padding:20px 24px calc(24px + var(--safe-b));max-height:86vh;}
  .point-tri b{font-size:22px;}
}

/* —— Laptop 1024–1279: light side margin only, content almost full —— */
@media (min-width:1024px){
  :root{ --shell-max:100%; }
  body{
    background:var(--bg);
    background-image:none;
  }
  #shell{
    width:100%;
    max-width:100%;
    min-height:100vh;
    margin:0;
    box-shadow:none;
    border-radius:0;
  }
  #content{padding:28px 40px calc(120px + var(--safe-b));max-width:1100px;margin:0 auto;width:100%;box-sizing:border-box;}
  .topbar{padding:calc(18px + var(--safe-t)) 40px 26px;}
  .topbar h2{font-size:32px;}
  .topbar .sub{font-size:13.5px;}
  .brand-mini .mark{width:46px;height:46px;}
  .icon-btn{width:44px;height:44px;border-radius:12px;}
  .hero-card{padding:40px 36px 36px;border-radius:10px 32px 10px 10px;min-height:240px;}
  .hero-card h2{font-size:28px;}
  .hero-card p{font-size:14.5px;max-width:70%;line-height:1.9;}
  .section-title{margin:40px 0 16px;}
  .section-title h3{font-size:18px;}
  .stat-grid{grid-template-columns:repeat(4, minmax(0, 1fr));gap:16px;}
  .stat-box{padding:20px;}
  .stat-box b{font-size:32px;}
  .card{padding:22px 24px;border-radius:14px;}
  .btn{max-width:400px;}
  .btn-row{max-width:560px;}
  .btn-row .btn,.btn-sm{max-width:none;}
  .bottomnav{
    width:min(720px, calc(100% - 48px));
    max-width:min(720px, calc(100% - 48px));
    bottom:calc(16px + var(--safe-b));
    border-radius:20px;
    padding:8px;
  }
  .navbtn{padding:10px 4px 9px;font-size:11px;border-radius:14px;}
  .navbtn .ic{font-size:20px;}
  .modal-back{align-items:center;justify-content:center;padding:24px;}
  .modal-sheet{
    border-radius:20px;
    max-width:min(520px, 100%);
    max-height:min(88vh, 720px);
    padding:24px 28px 28px;
    margin:0 auto;
  }
  .modal-handle{display:none;}
  .mcard-wrap{max-width:400px;margin-left:auto;margin-right:auto;}
  .point-tri{gap:12px;max-width:560px;}
  .point-tri b{font-size:24px;}
  #toastwrap{max-width:min(400px, calc(100% - 48px));bottom:calc(110px + var(--safe-b));}
  .card > p,.notice-card p,.empty-state p{max-width:65ch;}
}

/* —— 1280–1439 —— */
@media (min-width:1280px){
  #content{padding:32px 48px calc(124px + var(--safe-b));max-width:1200px;}
  .topbar{padding:calc(18px + var(--safe-t)) 48px 28px;}
  .topbar h2{font-size:33px;}
  .hero-card{padding:44px 40px 40px;min-height:250px;}
  .hero-card h2{font-size:29px;}
  .stat-grid{gap:18px;}
  .stat-box b{font-size:33px;}
  .card{padding:24px 26px;}
  .bottomnav{width:min(760px, calc(100% - 64px));max-width:min(760px, calc(100% - 64px));}
  .modal-sheet{max-width:540px;}
}

/* —— 1440–1919 —— */
@media (min-width:1440px){
  #content{padding:36px 56px calc(128px + var(--safe-b));max-width:1280px;}
  .topbar{padding:calc(20px + var(--safe-t)) 56px 28px;}
  .topbar h2{font-size:34px;}
  .hero-card{padding:48px 44px 42px;min-height:260px;}
  .hero-card h2{font-size:30px;}
  .hero-card p{font-size:15px;max-width:55%;}
  .stat-box b{font-size:34px;}
  .card{padding:24px 28px;}
  .bottomnav{width:min(800px, calc(100% - 80px));}
  .modal-sheet{max-width:560px;}
}

/* —— 1920+ : content capped, shell still full-bleed bg matches app —— */
@media (min-width:1920px){
  #content{padding:40px 64px calc(132px + var(--safe-b));max-width:1360px;}
  .topbar{padding:calc(22px + var(--safe-t)) 64px 30px;}
  .hero-card{padding:52px 48px 46px;}
  .hero-card h2{font-size:32px;}
  .stat-box b{font-size:36px;}
  .card{padding:26px 30px;}
}

/* Override old 481px “phone frame” side chrome if present */
@media (min-width:481px){
  body{
    background:var(--bg) !important;
    background-image:none !important;
  }
  #shell{
    min-height:100vh;
    box-shadow:none !important;
    border-radius:0 !important;
    max-width:100% !important;
    width:100% !important;
  }
}

/* Landscape short phones */
@media (max-width:900px) and (orientation:landscape) and (max-height:480px){
  #content{padding-bottom:calc(84px + var(--safe-b));}
  .bottomnav{bottom:calc(6px + var(--safe-b));padding:4px 5px;}
  .navbtn{padding:5px 2px 4px;font-size:9.5px;}
  .topbar h2{font-size:20px;margin-top:8px;}
  .hero-card{min-height:auto;padding:20px 18px;}
}

@media (min-width:768px){
  .form-grid-2,.fields-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .form-grid-2 .field-full,.fields-2col .field-full{grid-column:1 / -1;}
}
@media (max-width:767px){
  .table-wrap,.data-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-wrap table,.data-table-wrap table{min-width:480px;}
}
@media (min-width:768px){
  .table-wrap table,.data-table-wrap table{width:100%;min-width:0;}
}

/* ========== NATIVE PUSH (Capacitor) — Recent থেকে সরালেও নোটিফিকেশন ========== */
async function initNativePush() {
  if (typeof window.Capacitor === 'undefined' || !window.Capacitor.isNativePlatform()) {
    console.log('[Push] Web mode — using web FCM');
    return false;
  }
  try {
    var PushNotifications = null;
    if (window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications) {
      PushNotifications = window.Capacitor.Plugins.PushNotifications;
    } else {
      try {
        var mod = await import('@capacitor/push-notifications');
        PushNotifications = mod.PushNotifications;
      } catch (e) {
        console.warn('[Push] Plugin not found', e);
        return false;
      }
    }
    var permStatus = await PushNotifications.checkPermissions();
    if (permStatus.receive === 'prompt' || permStatus.receive === 'prompt-with-rationale') {
      permStatus = await PushNotifications.requestPermissions();
    }
    if (permStatus.receive !== 'granted') {
      console.warn('[Push] Native permission denied');
      if (typeof toast === 'function') toast('নোটিফিকেশন পারমিশন দিন', '');
      return false;
    }
    await PushNotifications.register();
    await PushNotifications.addListener('registration', async function(token) {
      console.log('[Push] Native FCM Token:', token.value);
      currentFcmToken = token.value;
      await saveNativeFcmToken(token.value);
    });
    await PushNotifications.addListener('registrationError', function(err) {
      console.error('[Push] Registration error', err);
    });
    await PushNotifications.addListener('pushNotificationReceived', function(notification) {
      console.log('[Push] Foreground', notification);
      var title = notification.title || 'উদার আত্মা সংগঠন';
      var body = notification.body || '';
      if (typeof toast === 'function') {
        toast((title + (body ? ': ' + body : '')).slice(0, 100), '');
      }
    });
    await PushNotifications.addListener('pushNotificationActionPerformed', function(action) {
      console.log('[Push] Tapped', action);
    });
    try {
      await PushNotifications.createChannel({
        id: 'udar_atma_default',
        name: 'উদার আত্মা',
        description: 'সংগঠনের নোটিফিকেশন',
        importance: 5,
        visibility: 1,
        sound: 'default',
        vibration: true,
        lights: true
      });
    } catch (chErr) {
      console.warn('[Push] Channel create', chErr);
    }
    console.log('[Push] Native push initialized');
    return true;
  } catch (e) {
    console.error('[Push] initNativePush failed', e);
    return false;
  }
}

async function saveNativeFcmToken(token) {
  if (!firebaseOK || !token || !fsDB) return;
  try {
    var memberId = (session && session.memberId)
      ? session.memberId
      : ('guest_' + (localStorage.getItem('fcm_guest_id') || Date.now()));
    if (!session || !session.memberId) {
      try { localStorage.setItem('fcm_guest_id', memberId); } catch (e) {}
    }
    var m = null;
    try { m = (typeof currentMember === 'function') ? currentMember() : null; } catch (e) {}

function initFCM() {
  if (!firebaseOK || typeof firebase.messaging !== 'function') {
    console.warn('FCM not available');
    return;
  }
  try {
    messaging = firebase.messaging();
  } catch (e) {
    console.warn('Messaging init failed', e);
    return;
  }

  messaging.onMessage(function(payload) {
    console.log('[FCM Foreground]', payload);
    var title = (payload.notification && payload.notification.title) || (payload.data && payload.data.title) || 'উদার আত্মা সংগঠন';
    var body  = (payload.notification && payload.notification.body)  || (payload.data && payload.data.body)  || '';
    if (typeof toast === 'function') {
      toast((title + (body ? ': ' + body : '')).slice(0, 100),
        '<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.7 1.7 0 003.4 0"/></svg>');
    }
    if (Notification.permission === 'granted' && navigator.serviceWorker) {
      navigator.serviceWorker.ready.then(function(reg) {
        reg.showNotification(title, { body: body, tag: 'fcm-fg', icon: NOTIF_ICON });
      }).catch(function(){});
    }
  });
}

async function requestFCMPermissionAndToken() {
  if (!messaging) {
    console.warn('messaging not ready');
    return null;
  }
  if (!('Notification' in window)) {
    console.warn('Notification API not supported');
    return null;
  }
  try {
    var permission = Notification.permission;
    if (permission === 'default') {
      permission = await Notification.requestPermission();
    }
    if (permission !== 'granted') {
      console.log('Notification permission denied');
      if (typeof toast === 'function') toast('Notifications blocked — enable in Settings','');
      return null;
    }

    // শুধু FCM service worker ব্যবহার করুন
    var swReg = await navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' });
    await navigator.serviceWorker.ready;

    var token = await messaging.getToken({
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: swReg
    });

    if (!token) {
      console.warn('getToken returned empty');
      if (typeof toast === 'function') toast('Token not available','');
      return null;
    }

    console.log('FCM Token:', token);
    currentFcmToken = token;
    await saveFcmTokenToFirestore(token);
    if (typeof toast === 'function') toast('Notifications enabled ✓','');
    try{ if(!localStorage.getItem('push_setup_done')) setTimeout(function(){ showPushSetupGuide(true); }, 600); }catch(e){}
    return token;
  } catch (err) {
    console.error('FCM token error:', err && err.message ? err.message : err);
    if (typeof toast === 'function') toast('FCM এরর: ' + (err && err.message ? err.message.slice(0,60) : 'unknown'),'');
    return null;
  }
}

async function saveFcmTokenToFirestore(token) {
  if (!firebaseOK || !token || !fsDB) return;
  try {
    var memberId = (session && session.memberId) ? session.memberId : ('guest_' + (localStorage.getItem('fcm_guest_id') || Date.now()));
    if (!session || !session.memberId) localStorage.setItem('fcm_guest_id', memberId);
    var m = null;
    try { m = (typeof currentMember === 'function') ? currentMember() : null; } catch(e){}
    var role = (session && session.role) ? session.role : 'guest';
    var bloodGroup = (m && m.bloodGroup) ? m.bloodGroup : '';
    var topics = ['all_members'];
    if (role === 'admin' || role === 'superadmin') topics.push('admins');
    if (role === 'superadmin') topics.push('superadmins');
    if (bloodGroup) topics.push('blood_' + String(bloodGroup).replace('+', 'pos').replace('-', 'neg'));
    await fsDB.collection('fcm_tokens').doc(token.substring(0, 40)).set({
      token: token,
      memberId: memberId,
      role: role,
      bloodGroup: bloodGroup,
      topics: topics,
      updatedAt: Date.now(),
      userAgent: navigator.userAgent
    }, { merge: true });
    console.log('FCM Token saved to Firestore', role, bloodGroup);
  } catch (e) {
    console.warn('Token save failed', e);
  }
}

/* FCM outbox — Cloud Function এই কালেকশন পড়ে পাঠাবে */
function queueFcmPush({title, body, target, bloodGroup, memberId, type}) {
  if (!firebaseOK || !fsDB) return Promise.resolve();
  var payload = {
    title: title || 'উদার আত্মা সংগঠন',
    body: body || '',
    target: target || 'all',
    bloodGroup: bloodGroup || null,
    memberId: memberId || null,
    type: type || 'general',
    status: 'pending',
    createdAt: Date.now(),
    by: (session && session.memberId) || null
  };
  return fsDB.collection('fcm_outbox').add(payload)
    .then(function(){
      console.log('FCM queued', payload.target);
      /* Vercel API — বন্ধ ফোনেও পুশ পাঠায় */
      try {
        var PUSH_API_URLS = [
          'https://udar-atma.vercel.app/api/process-outbox',
          'https://udar-atma-organisation.vercel.app/api/process-outbox'
        ];
        var callPushApi = function(i){
          if (i >= PUSH_API_URLS.length) return;
          fetch(PUSH_API_URLS[i], { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
            .then(function(r){
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json().catch(function(){ return {}; });
            })
            .then(function(j){ console.log('push process', j); })
            .catch(function(e){ console.warn('push API', PUSH_API_URLS[i], e); callPushApi(i + 1); });
        };
        callPushApi(0);
      } catch (e) {}
    })
    .catch(function(e){ console.warn('FCM queue failed', e); });
}

function pushToAll(title, body, type){ return queueFcmPush({title, body, target:'all', type}); }
function pushToAdmins(title, body, type){ return queueFcmPush({title, body, target:'admins', type}); }
function pushToSuperAdmins(title, body, type){ return queueFcmPush({title, body, target:'superadmins', type}); }
function pushToBlood(bg, title, body){ return queueFcmPush({title, body, target:'blood', bloodGroup:bg, type:'blood'}); }
function pushToMember(mid, title, body, type){ return queueFcmPush({title, body, target:'member', memberId:mid, type}); }



async function loadDBFromCloud(){
  if(!firebaseOK){ cloudReady = true; return null; }
  try{
    const snap = await fsDB.collection(FS_COLLECTION).doc(FS_DOC).get();
    if(snap.exists && snap.data().state){ cloudReady = true; return snap.data().state; }
  }catch(e){ cloudLoadFailed = true; console.warn('Cloud load failed, using local/demo data', e); }
  cloudReady = true;
  return null;
}
function saveDBToCloud(){
  if(!firebaseOK) return Promise.resolve();
  return fsDB.collection(FS_COLLECTION).doc(FS_DOC).set({ state: db, updatedAt: Date.now() })
    .catch(e=>console.warn('Cloud save failed, kept locally only', e));
}
function startRealtimeSync(){
  if(!firebaseOK) return;
  fsDB.collection(FS_COLLECTION).doc(FS_DOC).onSnapshot(snap=>{
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || !data.state) return;
    const incoming = data.state;
    if((incoming.updatedAt||0) > (db.updatedAt||0)){
      const prevIds = new Set((typeof myNotifications==='function'?myNotifications():[]).map(n=>n.id));
      db = incoming;
      if(!db.notifications) db.notifications = [];
      if(!db.reports) db.reports = [];
      ensurePointRules();
      localStorage.setItem(LS_KEY, JSON.stringify(db));
      tryRestorePendingSession();
      if(session.role!=='guest'){ myNotifications().filter(n=>!isReadByMe(n)&&!prevIds.has(n.id)).slice(0,3).forEach((n,i)=>setTimeout(()=>{ sysNotify(n); toast((n.title+(n.body?': '+n.body:'')).slice(0,90), notifIcon(n.type)); }, i*900)); }
      if(!document.getElementById('modalRoot')) render(); // don't wipe an open form
    }
  }, e=>console.warn('Realtime sync error', e));
}
async function refreshFromCloud(){
  try{
    const snap = await fsDB.collection(FS_COLLECTION).doc(FS_DOC).get();
    if(snap.exists && snap.data().state){
      const cloudData = snap.data().state;
      if((cloudData.updatedAt||0) >= (db.updatedAt||0)){
        db = cloudData;
        ensurePointRules();
        localStorage.setItem(LS_KEY, JSON.stringify(db));

    }

}

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seedData();
}
function mergeById(remoteArr, localArr){
  const map = {};
  (remoteArr || []).forEach(function(x){ if(x && x.id != null) map[x.id] = x; });
  (localArr || []).forEach(function(x){ if(x && x.id != null) map[x.id] = x; });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function saveDB(){
  db.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }catch(e){}
  if(!firebaseOK || !fsDB) return Promise.resolve();
  /* ক্লাউডের সাথে মার্জ — একসাথে সেভে ডাটা হারানো কমায় */
  return fsDB.collection(FS_COLLECTION).doc(FS_DOC).get().then(function(snap){
    if(snap.exists && snap.data() && snap.data().state){
      var remote = snap.data().state;
      if(remote.notifications || db.notifications){
        db.notifications = mergeById(remote.notifications, db.notifications);
        if(db.notifications.length > 600) db.notifications = db.notifications.slice(0, 600);
      }
      if(remote.members && db.members){
        var mm = {};
        remote.members.forEach(function(x){ if(x && x.id != null) mm[x.id] = x; });
        db.members.forEach(function(x){ if(x && x.id != null) mm[x.id] = Object.assign({}, mm[x.id] || {}, x); });
        db.members = Object.keys(mm).map(function(k){ return mm[k]; });
      }
    }
    db.updatedAt = Date.now();
    return saveDBToCloud();
  }).catch(function(e){
    console.warn('merge save fallback', e);
    return saveDBToCloud();
  });
}
function resetDemo(){ localStorage.removeItem(LS_KEY); location.reload(); }

    return '<svg class="'+cls+' svgi-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/></svg>';

/* ---------------- SESSION ---------------- */
const SESSION_KEY = 'udaratma_session';
function guestSession(){ return {screen:'app', role:'guest', memberId:null, tab:'home', authView:'login', regStep:1, adminTab:'dashboard'}; }
function loadSession(){
  /* লগইন করা সদস্যের সেশন localStorage-এ থাকে (ব্রাউজার/অ্যাপ বন্ধ করলেও থাকবে) — শুধু Logout করলে মুছবে */
  try{ const p = localStorage.getItem(SESSION_KEY); if(p){ const o = JSON.parse(p); if(o && o.memberId && o.role && o.role!=='guest') return o; } }catch(e){}
  try{ const r = sessionStorage.getItem(SESSION_KEY); if(r) return JSON.parse(r); }catch(e){}
  return guestSession();
}
function goToLogin(){ session.screen='auth'; session.authView='login'; render(); }
function backToApp(){ session.screen='app'; render(); }
function saveSession(){
  let str;
  try{
    if(session.role!=='guest' && session.memberId && !session.authAt) session.authAt = Date.now();
    str = JSON.stringify(session);
  }catch(e){ return; }
  const loggedIn = session.role!=='guest' && !!session.memberId;
  try{ sessionStorage.setItem(SESSION_KEY, str); }catch(e){}
  /* গুরুত্বপূর্ণ: লগইন সেশন শুধু সদস্য নিজে Logout করলেই (clearPersistedSession) মুছবে — অতিথি/খালি ট্যাবের রেন্ডারে কখনোই নয় */
  if(loggedIn){
    try{ localStorage.setItem(SESSION_KEY, str); }catch(e){}
    /* পুরনো logout ফ্ল্যাগ মুছে দাও — না হলে focus-এ অটো লগআউট হতে পারে */
    try{ localStorage.removeItem(LOGOUT_KEY); }catch(e){}
  }
}
const LOGOUT_KEY = 'udaratma_logout_at';
function clearPersistedSession(){
  try{ localStorage.setItem(LOGOUT_KEY, String(Date.now())); }catch(e){}
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
}
function sessionRoleOf(m){ return m.role==='superadmin'?'superadmin':m.role==='admin'?'admin':'member'; }
let pendingSession = null;
/* অ্যাপ খোলার সময় সংরক্ষিত সেশন যাচাই।
   trusted=true মানে ক্লাউড থেকে সদ্য সফলভাবে ডাটা এসেছে। ডাটা যাচাই করা না গেলে (অফলাইন / ডাটা লোড ব্যর্থ) কখনোই লগআউট করা হয় না। */
function validatePersistedSession(trusted){
  /* অটো লগআউট বন্ধ: শুধু ইউজার নিজে logout() করলে সেশন মুছে */
  if(!session || session.role==='guest' || !session.memberId) return;
  const mid = session.memberId;
  const m = db && db.members ? db.members.find(x=>x.id===mid || String(x.id)===String(mid)) : null;
  if(m){
    /* শুধু ব্যান/সাসপেন্ডে সেশন সীমিত — PENDING-এ লগআউট নয় */
    if(['TEMP_BANNED','PERMA_BANNED','SUSPENDED'].includes(m.status)){
      if(trusted){ clearPersistedSession(); session = guestSession(); }
      return;
    }
    session.role = sessionRoleOf(m);
    return;
  }
  /* সদস্য তালিকায় না পেলেও লগআউট নয় — অফলাইন/লোড বিলম্বে সেশন রাখো */
  if(!trusted){
    pendingSession = session;
  }
}
function tryRestorePendingSession(){
  try{
    if(!pendingSession || !db || !db.members) return;
    const mid = pendingSession.memberId;
    const m = db.members.find(x=>x.id===mid || String(x.id)===String(mid));
    const ps = pendingSession; pendingSession = null;
    if(m && ['TEMP_BANNED','PERMA_BANNED','SUSPENDED'].includes(m.status)){
      clearPersistedSession(); return;
    }
    if(session && session.role!=='guest') return;
    if(m) ps.role = sessionRoleOf(m);
    session = ps; saveSession();
  }catch(e){}
}
/* অন্য ট্যাবে সদস্য নিজে Logout করলে এই ট্যাবও লগআউট হবে (পুরোনো ট্যাব আবার লগইন "জীবিত" করতে পারবে না) */
function checkLogoutElsewhere(){
  try{
    if(!session || session.role==='guest' || !session.memberId) return;
    const t = Number(localStorage.getItem(LOGOUT_KEY)||0);
    if(t && t > (session.authAt||0)){ session = guestSession(); render(); }
  }catch(e){}
}

}

  animateStatCounters();

function animateStatCounters(){
  document.querySelectorAll('.stat-box b').forEach(el=>{
    const raw = el.textContent;
    const m = raw.match(/^(\D*)(\d+)(\D*)$/);
    if(!m) return;
    const prefix=m[1], target=parseInt(m[2],10), suffix=m[3];
    if(isNaN(target) || target===0){ return; }
    let cur=0; const step=Math.max(1,Math.ceil(target/18));
    el.textContent = prefix+'0'+suffix;
    const t=setInterval(()=>{
      cur+=step;
      if(cur>=target){ cur=target; clearInterval(t); }
      el.textContent = prefix+cur+suffix;
    }, 18);
  });
}

function computeBadges(m){
  const badges = [];
  if(m.role==='superadmin') badges.push({icon:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8l4 4 6-8 6 8 4-4v11H2V8zM6 19h12"/></svg>',label:'সুপার এডমিন',cls:'gold'});
  else if(m.role==='admin') badges.push({icon:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',label:'এডমিন',cls:'navy'});
  if(m.lastDonationDate){
    badges.push({icon:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5S19 10.2 19 15a7 7 0 11-14 0C5 10.2 12 2.5 12 2.5z"/></svg>',label:'রক্তদাতা',cls:'red'});
    if(daysBetween(m.lastDonationDate)<=90) badges.push({icon:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5V7a2 2 0 014 0v4M10.5 11V6a2 2 0 014 0v7M14.5 13V8a2 2 0 014 0v8a5.5 5.5 0 01-5.5 5.5h-2A5.5 5.5 0 015.5 16v-4a2 2 0 014 0v1"/></svg>',label:'সক্রিয় দাতা',cls:'red'});
  }
  const score = (m.plus||0)-(m.minus||0);
  if(score>=60) badges.push({icon:'<svg class="svgi svgi-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.8 7.2 17l.9-5.4L4.2 7.7l5.4-.8L12 2z"/></svg>',label:'গোল্ড কন্ট্রিবিউটর',cls:'gold'});
  else if(score>=30) badges.push({icon:'<svg class="svgi svgi-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.8 7.2 17l.9-5.4L4.2 7.7l5.4-.8L12 2z"/></svg>',label:'সিলভার কন্ট্রিবিউটর',cls:'silver'});
  else if(score>=10) badges.push({icon:'<svg class="svgi svgi-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.8 7.2 17l.9-5.4L4.2 7.7l5.4-.8L12 2z"/></svg>',label:'ব্রোঞ্জ কন্ট্রিবিউটর',cls:'bronze'});
  if(m.contribution==='PAID') badges.push({icon:'<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l5 5L20 7"/></svg>',label:'নিয়মিত চাঁদাদাতা',cls:'green'});
  return badges;
}
function badgeRowHTML(m){
  const badges = computeBadges(m);

  return `<div class="badge-row">${badges.map(b=>`<span class="badge-chip badge-${b.cls}">${b.icon} ${b.label}</span>`).join('')}</div>`;
}

/* Shows a system-set timestamp as the actual date (today onward), relative days from day 1 to 7.
   Only for dates the system sets automatically — never for dates an admin/superadmin types in manually. */
const bnMonths = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function bnDigits(n){ return String(n).replace(/[0-9]/g, d=>'০১২৩৪৫৬৭৮৯'[d]); }
function bnDateStr(d){ return `${bnDigits(d.getDate())} ${bnMonths[d.getMonth()]}, ${bnDigits(d.getFullYear())}`; }
function relDate(val){
  if(typeof val !== 'number') return val; // legacy/manually-entered value: show as-is
  const days = Math.max(0, Math.floor((Date.now()-val)/(1000*60*60*24)));
  if(days===0) return bnDateStr(new Date(val));
  if(days<=7) return `${days} দিন আগে`;
  return bnDateStr(new Date(val));
}

/* ---------------- BLOOD ---------------- */
function daysBetween(dateStr){
  if(!dateStr) return Infinity;
  const then = new Date(dateStr+'T00:00:00');
  const now = new Date();
  return Math.max(0, Math.floor((now-then)/(1000*60*60*24)));
}
function donationLabel(dateStr){
  if(!dateStr) return 'কখনো রক্ত দেননি';
  const d = daysBetween(dateStr);
  if(d===0) return 'আজ';
  if(d<30) return `${d} দিন আগে`;
  if(d<365) return `প্রায় ${Math.floor(d/30)} মাস আগে`;
  return `প্রায় ${Math.floor(d/365)} বছর আগে`;
}

function completedBloodSectionHTML(){
  /* ইতিহাস = সম্পন্ন করা (completion সহ) এবং আগে "সমাধান হয়েছে" হিসেবে বন্ধ করা সব অনুরোধ */

      (c.donors||[]).forEach(d=>rows.push(`<div>• ${esc(d.name)} — <b>${bnNum(d.bags)} ব্যাগ</b></div>`));

function submitBloodRequest(){
  const name=document.getElementById('bqName').value.trim();
  const mobile=document.getElementById('bqMobile').value.trim().replace(/[\s-]/g,'');
  if(!name){ toast('রোগীর নাম দিন','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'); return; }
  if(!mobile || mobile.length<10){ toast('সঠিক মোবাইল নম্বর দিন','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'); return; }
  const needRaw = (document.getElementById('bqDate')||{}).value || '';
  const dm = needRaw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!dm){ toast('কোন দিন রক্ত লাগবে তা নির্বাচন করুন','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'); return; }
  const needDate = new Date(Number(dm[1]), Number(dm[2])-1, Number(dm[3]));
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  if(needDate < todayStart){ toast('অতীতের তারিখ দেওয়া যাবে না','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>'); return; }
  const seq = db.nextBloodReqSeq++;
  const bg = document.getElementById('bqGroup').value;
  db.bloodRequests.unshift({id:`UA-BR-2026-${String(seq).padStart(3,'0')}`, patient:name, mobile, bg, hospital:document.getElementById('bqHosp').value||'—', units:document.getElementById('bqUnits').value, urgency:'জরুরি', date:bnDateStr(needDate), needDate:needRaw, status:'active'});
  notifyAdmins('রক্তের প্রয়োজন', `${bg} — ${name} (${document.getElementById('bqHosp').value||'—'})`, 'blood');
  db.members.filter(x=>x.status==='ACTIVE' && x.role==='member' && x.bloodGroup===bg).forEach(x=>{
    notifyMember(x.id, 'জরুরি রক্তের প্রয়োজন', `${bg} গ্রুপের রক্ত প্রয়োজন — ${name}`, 'blood');
  });
  saveDB(); closeModal(); session.bloodTab='requests'; render();
  toast('আপনার অনুরোধ জমা হয়েছে','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 100-20 10 10 0 000 20zM12 8v5M12 16h.01"/></svg>');
}

const CONTRIBUTION_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function paidMonthList(member){ return Array.isArray(member.paidMonths) ? member.paidMonths : (member.contribution==='PAID' ? [...CONTRIBUTION_MONTHS] : []); }
function unpaidMonthList(member){ const paid=paidMonthList(member); return CONTRIBUTION_MONTHS.filter(x=>!paid.includes(x)); }
function contributionState(member){
  const paid=paidMonthList(member).length;
  if(paid>=12) return 'PAID';
  if(db.payments.some(p=>p.member===member.id && p.status==='pending')) return 'PENDING_VERIFICATION';
  return 'DUE';
}
function monthBoxesHTML(member){

}

function qrPlaceholder(seed){
  // simple deterministic pseudo-QR grid purely for visual demo purposes
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0;
  let cells='';
  for(let y=0;y<11;y++)for(let x=0;x<11;x++){
    h = (h*1103515245+12345)>>>0;
    if((h>>16)%3===0 || (x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7)) cells+=`<rect x="${x*2.6+1}" y="${y*2.6+1}" width="2.2" height="2.2" fill="#0F0F54"/>`;
  }
  return cells;
}

let _pendingPhotoData = null;
function handlePhotoSelect(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = 240;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      _pendingPhotoData = canvas.toDataURL('image/jpeg', 0.85);
      const prev = document.getElementById('photoPreview');
      if(prev) prev.innerHTML = `<img src="${_pendingPhotoData}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  if(type==='payment'){
    const p=db.payments.find(x=>String(x.id)===String(id));

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>{
    const s = (c===null||c===undefined)?'':String(c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0;">${unpaid.map(month=>`<label style="border:1px solid var(--line,#ddd);border-radius:9px;padding:10px 5px;text-align:center;font-size:12px;"><input type="checkbox" class="admin-paid-month" value="${month}"> ${month}</label>`).join('')}</div>

function adminAddPaidMonths(id){
  if(session.role!=='superadmin'){toast('শুধু সুপার এডমিন এই কাজ করতে পারবেন','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 100-20 10 10 0 000 20zM4.9 4.9l14.2 14.2"/></svg>');return;}
  const m=getMember(id); if(!m)return;
  const months=[...document.querySelectorAll('.admin-paid-month:checked')].map(x=>x.value);
  if(!months.length){toast('অন্তত একটি মাস নির্বাচন করুন','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18.1A2 2 0 003.5 21h17a2 2 0 001.7-2.9L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>');return;}
  if(!Array.isArray(m.paidMonths))m.paidMonths=[];
  months.forEach(month=>{if(!m.paidMonths.includes(month))m.paidMonths.push(month);});
  m.contribution=m.paidMonths.length>=12?'PAID':'DUE';
  db.payments.unshift({id:`UA-PAY-ADM-${Date.now()}`, member:m.id, memberName:m.name, offer:months.join(', '), months, amount:months.length*100, txid:'ADMIN-ENTRY', date:new Date().toLocaleDateString('bn-BD'), status:'approved'});
  addAudit('সদস্যের চাঁদার মাস যুক্ত করেছেন',`${m.name}: ${months.join(', ')}`);
  notifyMember(m.id,'চাঁদা যুক্ত হয়েছে',`${months.join(', ')} মাসের চাঁদা পরিশোধিত হিসেবে যুক্ত হয়েছে`,'payment');
  saveDB();closeModal();openMemberDetail(id);toast('নির্বাচিত মাসগুলো পরিশোধিত হিসেবে যুক্ত হয়েছে','<svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l5 5L20 7"/></svg>');
}
