name: Generate Web Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Generate icons from sources
        run: |
          python3 << 'PY'
          from PIL import Image, ImageFilter
          import os

          assert os.path.exists('icon-source.png'), 'icon-source.png missing'
          assert os.path.exists('icon-notification.png'), 'icon-notification.png missing'

          src = Image.open('icon-source.png').convert('RGBA')
          side, scale = 1024, 0.92
          ls = int(side * scale)
          logo = src.resize((ls, ls), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (side, side), (255, 255, 255, 255))
          canvas.paste(logo, ((side - ls) // 2, (side - ls) // 2), logo)
          rgb = Image.new('RGB', (side, side), (255, 255, 255))
          rgb.paste(canvas, mask=canvas.split()[-1])
          rgb.resize((192, 192), Image.Resampling.LANCZOS).save('icon-192.png')
          rgb.resize((512, 512), Image.Resampling.LANCZOS).save('icon-512.png')

          scale_m = 0.72
          ls = int(side * scale_m)
          logo_m = src.resize((ls, ls), Image.Resampling.LANCZOS)
          cm = Image.new('RGBA', (side, side), (255, 255, 255, 255))
          cm.paste(logo_m, ((side - ls) // 2, (side - ls) // 2), logo_m)
          rm = Image.new('RGB', (side, side), (255, 255, 255))
          rm.paste(cm, mask=cm.split()[-1])
          rm.resize((512, 512), Image.Resampling.LANCZOS).save('icon-512-maskable.png')

          # Small icon with THICK brackets
          sm = Image.open('icon-notification.png').convert('RGBA')
          w, h = sm.size
          px = sm.load()
          mask = Image.new('L', (w, h), 0)
          mp = mask.load()
          for y in range(h):
              for x in range(w):
                  r, g, b, a = px[x, y]
                  if r < 100 and g < 100 and b < 130:
                      mp[x, y] = 255
                  elif b > r + 20 and r < 90:
                      mp[x, y] = 255
          thick = mask
          for _ in range(8):
              thick = thick.filter(ImageFilter.MaxFilter(3))
          thick = thick.filter(ImageFilter.GaussianBlur(1.2))
          thick = thick.point(lambda v: 255 if v > 100 else 0)

          RED, NAVY = (0xE3, 0x1C, 0x24, 255), (0x0F, 0x0F, 0x54, 255)
          out = Image.new('RGBA', (w, h), RED)
          op, tp = out.load(), thick.load()
          for y in range(h):
              for x in range(w):
                  if tp[x, y] > 128:
                      op[x, y] = NAVY
          bbox = thick.getbbox()
          pad = int(max(bbox[2]-bbox[0], bbox[3]-bbox[1]) * 0.08)
          cx0, cy0 = max(0, bbox[0]-pad), max(0, bbox[1]-pad)
          cx1, cy1 = min(w, bbox[2]+pad), min(h, bbox[3]+pad)
          cropped = out.crop((cx0, cy0, cx1, cy1))
          cw, ch = cropped.size
          side2 = max(cw, ch)
          sq = Image.new('RGBA', (side2, side2), RED)
          sq.paste(cropped, ((side2-cw)//2, (side2-ch)//2))
          sq.resize((96, 96), Image.Resampling.LANCZOS).save('badge-96.png')
          print('Generated with thick brackets')
          PY
          ls -la icon-192.png icon-512.png icon-512-maskable.png badge-96.png

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-512-maskable.png badge-96.png
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Icons with thicker notification brackets"
          git push
