name: Generate Web Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Generate icons from sources
        run: |
          python3 << 'PY'
          from PIL import Image
          import os, base64
          from io import BytesIO

          assert os.path.exists('icon-source.png'), 'icon-source.png missing'

          src = Image.open('icon-source.png').convert('RGBA')
          side, scale = 1024, 0.92
          ls = int(side * scale)
          logo = src.resize((ls, ls), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (side, side), (255, 255, 255, 255))
          canvas.paste(logo, ((side - ls) // 2, (side - ls) // 2), logo)
          rgb = Image.new('RGB', (side, side), (255, 255, 255))
          rgb.paste(canvas, mask=canvas.split()[-1])
          rgb.resize((192, 192), Image.Resampling.LANCZOS).save('icon-192.png')
          rgb.resize((512, 512), Image.Resampling.LANCZOS).save('icon-512.png')

          scale_m = 0.72
          ls = int(side * scale_m)
          logo_m = src.resize((ls, ls), Image.Resampling.LANCZOS)
          cm = Image.new('RGBA', (side, side), (255, 255, 255, 255))
          cm.paste(logo_m, ((side - ls) // 2, (side - ls) // 2), logo_m)
          rm = Image.new('RGB', (side, side), (255, 255, 255))
          rm.paste(cm, mask=cm.split()[-1])
          rm.resize((512, 512), Image.Resampling.LANCZOS).save('icon-512-maskable.png')

          # Flame-only small icon (user provided, no brackets)
          b64 = """"""
          flame = Image.open(BytesIO(base64.b64decode(b64))).convert('RGBA')
          flame.save('icon-notification.png')
          flame.resize((96, 96), Image.Resampling.LANCZOS).save('badge-96.png')
          print('Generated icons + flame badge')
          PY
          ls -la icon-192.png icon-512.png icon-512-maskable.png badge-96.png icon-notification.png

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-512-maskable.png badge-96.png icon-notification.png
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Icons: flame-only notification (no brackets)"
          git push
