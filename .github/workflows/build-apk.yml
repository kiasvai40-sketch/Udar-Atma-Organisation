name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Install npm packages
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Prepare app icon
        run: |
          mkdir -p resources
          # লোগো খুঁজে resources/icon.png বানাও
          if [ -f resources/icon.png ]; then
            echo "Using resources/icon.png"
          elif [ -f icon-source.png ]; then
            cp icon-source.png resources/icon.png
            echo "Using icon-source.png"
          elif [ -f icon-512.png ]; then
            cp icon-512.png resources/icon.png
            echo "Using icon-512.png"
          elif [ -f icon-192.png ]; then
            cp icon-192.png resources/icon.png
            echo "Using icon-192.png"
          else
            echo "WARNING: No icon found — default Capacitor icon will be used"
          fi
          ls -la resources/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons from logo
        run: |
          if [ -f resources/icon.png ]; then
            npx capacitor-assets generate --android \
              --iconBackgroundColor '#0F0F54' \
              --iconBackgroundColorDark '#0F0F54' || echo "assets generate failed, continuing"
          fi

      - name: Copy google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json missing"
            exit 1
          fi
          cp google-services.json android/app/google-services.json

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "default_notification_channel_id" "$MANIFEST"; then
            sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="udar_atma_default" />\n    </application>|' "$MANIFEST"
          fi

      - name: Enable Google Services plugin
        run: |
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: udar-atma-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
