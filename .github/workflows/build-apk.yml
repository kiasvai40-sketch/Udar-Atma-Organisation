name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Install npm packages
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Prepare icon for Capacitor Assets
        run: |
          mkdir -p resources
          if [ -f icon-source.png ]; then
            cp icon-source.png resources/icon.png
            echo "Using icon-source.png"
          elif [ -f icon-512.png ]; then
            cp icon-512.png resources/icon.png
            echo "Using icon-512.png"
          else
            echo "ERROR: No icon-source.png or icon-512.png found"
            exit 1
          fi
          # splash optional — না থাকলে assets skip করতে পারে
          file resources/icon.png
          ls -lah resources/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons (official way)
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0F0F54' \
            --iconBackgroundColorDark '#0F0F54'
          echo "=== Generated launcher files ==="
          find android/app/src/main/res -name "ic_launcher*" | sort

      - name: Set app name উদার আত্মা
        run: |
          python3 -c "
          import pathlib, re
          p = pathlib.Path('android/app/src/main/res/values/strings.xml')
          t = p.read_text(encoding='utf-8')
          t = re.sub(r'<string name=\"app_name\">[^<]*</string>', '<string name=\"app_name\">উদার আত্মা</string>', t)
          t = re.sub(r'<string name=\"title_activity_main\">[^<]*</string>', '<string name=\"title_activity_main\">উদার আত্মা</string>', t)
          p.write_text(t, encoding='utf-8')
          print(p.read_text(encoding='utf-8'))
          "

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "default_notification_channel_id" "$MANIFEST"; then
            sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="udar_atma_default" />\n    </application>|' "$MANIFEST"
          fi

      - name: Enable Google Services plugin
        run: |
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          OUT="android/app/build/outputs/apk/debug"
          ls -lah "$OUT"
          mv "$OUT/app-debug.apk" "$OUT/Udar-Atma.apk"
          SIZE=$(stat -c%s "$OUT/Udar-Atma.apk")
          echo "APK size: $SIZE bytes"
          ls -lah "$OUT/Udar-Atma.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: udar-atma-apk
          path: android/app/build/outputs/apk/debug/Udar-Atma.apk
          retention-days: 14
