name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Install npm packages
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app name
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            python3 - << 'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/res/values/strings.xml")
          t = p.read_text(encoding="utf-8")
          t = re.sub(r'<string name="app_name">[^<]*</string>',
                     '<string name="app_name">উদার আত্মা</string>', t)
          t = re.sub(r'<string name="title_activity_main">[^<]*</string>',
                     '<string name="title_activity_main">উদার আত্মা</string>', t)
          p.write_text(t, encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY
          fi

      - name: Copy custom icons if available
        run: |
          # icon-source বা icon-512 থেকে সব mipmap-এ কপি (সহজ পদ্ধতি)
          SRC=""
          if [ -f icon-source.png ]; then SRC=icon-source.png
          elif [ -f icon-512.png ]; then SRC=icon-512.png
          fi
          if [ -n "$SRC" ]; then
            echo "Using icon: $SRC"
            for dir in android/app/src/main/res/mipmap-*; do
              [ -d "$dir" ] || continue
              for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
                if [ -f "$dir/$f" ] || true; then
                  cp "$SRC" "$dir/ic_launcher.png" 2>/dev/null || true
                  cp "$SRC" "$dir/ic_launcher_round.png" 2>/dev/null || true
                fi
              done
            done
            # adaptive icon foreground
            for dir in android/app/src/main/res/mipmap-*; do
              [ -d "$dir" ] || continue
              cp "$SRC" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            done
            echo "Icons copied"
            find android/app/src/main/res -name "ic_launcher*.png" | head -30
          else
            echo "No custom icon — using default"
          fi

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "default_notification_channel_id" "$MANIFEST"; then
            sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="udar_atma_default" />\n    </application>|' "$MANIFEST"
          fi

      - name: Enable Google Services plugin
        run: |
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          OUT="android/app/build/outputs/apk/debug"
          ls -la "$OUT"
          APK=$(find "$OUT" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 2000000 ]; then
            echo "ERROR: APK too small ($SIZE) — build likely broken"
            exit 1
          fi
          mv "$APK" "$OUT/Udar-Atma.apk"
          ls -la "$OUT/Udar-Atma.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: udar-atma-apk
          path: android/app/build/outputs/apk/debug/Udar-Atma.apk
          retention-days: 14
