name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Install npm packages
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Prepare icon for Capacitor Assets
        run: |
          mkdir -p resources
          if [ -f icon-source.png ]; then
            cp icon-source.png resources/icon.png
            echo "Using icon-source.png"
          elif [ -f icon-512.png ]; then
            cp icon-512.png resources/icon.png
            echo "Using icon-512.png"
          else
            echo "ERROR: No icon-source.png or icon-512.png found"
            exit 1
          fi
          # splash optional — না থাকলে assets skip করতে পারে
          file resources/icon.png
          ls -lah resources/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons (official way)
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#FFFFFF'
          echo "=== Generated launcher files ==="
          find android/app/src/main/res -name "ic_launcher*" | sort

      - name: Set app name উদার আত্মা
        run: |
          python3 -c "
          import pathlib, re
          p = pathlib.Path('android/app/src/main/res/values/strings.xml')
          t = p.read_text(encoding='utf-8')
          t = re.sub(r'<string name=\"app_name\">[^<]*</string>', '<string name=\"app_name\">উদার আত্মা</string>', t)
          t = re.sub(r'<string name=\"title_activity_main\">[^<]*</string>', '<string name=\"title_activity_main\">উদার আত্মা</string>', t)
          p.write_text(t, encoding='utf-8')
          print(p.read_text(encoding='utf-8'))
          "

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Generate notification icon from logo (white silhouette)
        run: |
          pip install pillow numpy || pip install --break-system-packages pillow numpy || true
          mkdir -p android/app/src/main/res/values
          python3 - <<'PY' || echo "Icon generation failed - skipping notification icon"
          from PIL import Image
          import numpy as np, os
          src = 'icon-source.png' if os.path.exists('icon-source.png') else 'icon-512.png'
          a = np.array(Image.open(src).convert('RGB')).astype(int)
          h, w, _ = a.shape
          r, g, b = a[..., 0], a[..., 1], a[..., 2]
          red = (r > 180) & (g < 80) & (b < 80)
          ys, xs = np.where(red)
          x0, x1, y0, y1 = xs.min(), xs.max(), ys.min(), ys.max()
          cx, cy, R = (x0 + x1) / 2, (y0 + y1) / 2, (x1 - x0) / 2
          yy, xx = np.mgrid[0:h, 0:w]
          inside = ((xx - cx) ** 2 + (yy - cy) ** 2) < (R * 0.97) ** 2
          mask = (r > 200) & (g > 200) & (b > 200) & inside & (np.abs(xx - cx) < R * 0.22)
          ys, xs = np.where(mask)
          m = mask[ys.min():ys.max() + 1, xs.min():xs.max() + 1]
          mh, mw = m.shape
          side = int(max(mh, mw) * 1.08)
          canvas = np.zeros((side, side), dtype=np.uint8)
          oy, ox = (side - mh) // 2, (side - mw) // 2
          canvas[oy:oy + mh, ox:ox + mw] = m * 255
          alpha = Image.fromarray(canvas)
          sizes = {'mdpi': 24, 'hdpi': 36, 'xhdpi': 48, 'xxhdpi': 72, 'xxxhdpi': 96}
          for d, s in sizes.items():
              p = f'android/app/src/main/res/drawable-{d}'
              os.makedirs(p, exist_ok=True)
              out = Image.new('RGBA', (s, s), (255, 255, 255, 0))
              out.putalpha(alpha.resize((s, s), Image.LANCZOS))
              out.save(p + '/ic_stat_notification.png')
          open('android/app/src/main/res/values/notification_color.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="notification_color">#FFFFFF</color>\n</resources>\n')
          PY
          find android/app/src/main/res -name "ic_stat_notification*" | sort || true

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f android/app/src/main/res/drawable-mdpi/ic_stat_notification.png ] && ! grep -q "default_notification_icon" "$MANIFEST"; then
            sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notification" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notification_color" />\n    </application>|' "$MANIFEST"
          fi
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "default_notification_channel_id" "$MANIFEST"; then
            sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="udar_atma_default" />\n    </application>|' "$MANIFEST"
          fi

      - name: Enable Google Services plugin
        run: |
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add pull-to-refresh
        run: |
          PUB=android/app/src/main/assets/public
          if [ -f "$PUB/index.html" ]; then
            cat > "$PUB/pull-to-refresh.js" <<'JS'
          (function () {
            var THRESHOLD = 70, MAX = 110;
            var startY = 0, dy = 0, active = false, refreshing = false;

            var el = document.createElement('div');
            el.setAttribute('style',
              'position:fixed;left:50%;top:0;width:40px;height:40px;margin-left:-20px;' +
              'border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);' +
              'display:flex;align-items:center;justify-content:center;z-index:2147483647;' +
              'transform:translateY(-60px);opacity:0;pointer-events:none;');
            el.innerHTML =
              '<svg id="ptr-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" ' +
              'stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>';
            var st = document.createElement('style');
            st.textContent = '@keyframes ptrspin{to{transform:rotate(360deg)}}' +
              'html,body{overscroll-behavior-y:contain}';
            document.head.appendChild(st);
            document.body.appendChild(el);
            var svg = el.querySelector('#ptr-svg');

            function scrolledAncestor(node) {
              while (node && node !== document.body && node !== document.documentElement) {
                if (node.nodeType === 1) {
                  var oy = getComputedStyle(node).overflowY;
                  if ((oy === 'auto' || oy === 'scroll') && node.scrollHeight > node.clientHeight && node.scrollTop > 0) return true;
                }
                node = node.parentNode;
              }
              return false;
            }
            function pageAtTop() {
              var se = document.scrollingElement || document.documentElement;
              return se.scrollTop <= 0;
            }
            function setPos(d) {
              var y = Math.min(d, MAX);
              el.style.opacity = Math.min(1, d / THRESHOLD);
              el.style.transform = 'translateY(' + (y - 50 + 10) + 'px)';
              svg.style.transform = 'rotate(' + (d * 3) + 'deg)';
            }
            function reset() {
              el.style.transition = 'transform .25s, opacity .25s';
              el.style.transform = 'translateY(-60px)';
              el.style.opacity = 0;
              setTimeout(function () { el.style.transition = ''; }, 300);
            }

            document.addEventListener('touchstart', function (e) {
              if (refreshing || e.touches.length !== 1) return;
              var t = e.target;
              if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
              if (!pageAtTop() || scrolledAncestor(t)) return;
              startY = e.touches[0].clientY; dy = 0; active = true;
            }, { passive: true });

            document.addEventListener('touchmove', function (e) {
              if (!active || refreshing) return;
              dy = (e.touches[0].clientY - startY) * 0.5;
              if (dy <= 0) { active = false; reset(); return; }
              if (!pageAtTop()) { active = false; reset(); return; }
              if (dy > 8 && e.cancelable) e.preventDefault();
              setPos(dy);
            }, { passive: false });

            document.addEventListener('touchend', function () {
              if (!active) return;
              active = false;
              if (dy >= THRESHOLD) {
                refreshing = true;
                el.style.transform = 'translateY(' + (THRESHOLD - 40) + 'px)';
                el.style.opacity = 1;
                svg.style.animation = 'ptrspin .7s linear infinite';
                setTimeout(function () { location.reload(); }, 400);
              } else { reset(); }
            });
          })();
          JS
            if ! grep -q "pull-to-refresh.js" "$PUB/index.html"; then
              sed -i 's|</body>|<script src="pull-to-refresh.js"></script></body>|' "$PUB/index.html"
            fi
            grep -c "pull-to-refresh.js" "$PUB/index.html" || true
          else
            echo "index.html not found in $PUB - skipping pull-to-refresh"
          fi

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          OUT="android/app/build/outputs/apk/debug"
          ls -lah "$OUT"
          mv "$OUT/app-debug.apk" "$OUT/Udar-Atma.apk"
          SIZE=$(stat -c%s "$OUT/Udar-Atma.apk")
          echo "APK size: $SIZE bytes"
          ls -lah "$OUT/Udar-Atma.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: udar-atma-apk
          path: android/app/build/outputs/apk/debug/Udar-Atma.apk
          retention-days: 14
