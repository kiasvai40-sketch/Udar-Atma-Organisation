name: Build Release Signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick python3-pil

      - name: Install npm packages
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Prepare launcher icon (white BG, scale 0.92)
        run: |
          mkdir -p resources
          test -f icon-source.png || { echo "icon-source.png missing"; exit 1; }
          python3 << 'PY'
          from PIL import Image
          src = Image.open('icon-source.png').convert('RGBA')
          side, scale = 1024, 0.92
          ls = int(side * scale)
          logo = src.resize((ls, ls), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (side, side), (255, 255, 255, 255))
          canvas.paste(logo, ((side-ls)//2, (side-ls)//2), logo)
          rgb = Image.new('RGB', (side, side), (255, 255, 255))
          rgb.paste(canvas, mask=canvas.split()[-1])
          rgb.save('resources/icon.png')
          print('launcher icon ready')
          PY

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Generate adaptive launcher icons
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#FFFFFF'

      - name: Create notification icons
        run: |
          mkdir -p android/app/src/main/res/drawable
          python3 << 'PY'
          from PIL import Image
          import base64, os
          from io import BytesIO
          b64 = """"""
          flame = Image.open(BytesIO(base64.b64decode(b64))).convert('RGBA')
          flame.resize((256, 256), Image.Resampling.LANCZOS).save('android/app/src/main/res/drawable/ic_notification_large.png')
          sil = Image.new('RGBA', (96, 96), (0, 0, 0, 0))
          sm = flame.resize((96, 96), Image.Resampling.LANCZOS)
          sp, sip = sm.load(), sil.load()
          for y in range(96):
              for x in range(96):
                  r, g, b, a = sp[x, y]
                  if b > r + 10 and r < 100:
                      sip[x, y] = (255, 255, 255, 255)
          sil.save('android/app/src/main/res/drawable/ic_stat_udar.png')
          print('flame notification icons ready')
          PY
          ls -la android/app/src/main/res/drawable/

      - name: Set app name
        run: |
          python3 -c "
          import pathlib, re
          p = pathlib.Path('android/app/src/main/res/values/strings.xml')
          t = p.read_text(encoding='utf-8')
          t = re.sub(r'<string name=\"app_name\">[^<]*</string>', '<string name=\"app_name\">উদার আত্মা</string>', t)
          t = re.sub(r'<string name=\"title_activity_main\">[^<]*</string>', '<string name=\"title_activity_main\">উদার আত্মা</string>', t)
          p.write_text(t, encoding='utf-8')
          "

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "default_notification_icon" "$MANIFEST"; then
            sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_udar" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="udar_atma_default" />\n    </application>|' "$MANIFEST"
          fi

      - name: Enable Google Services plugin
        run: |
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Prepare keystore
        run: |
          test -f release.keystore || { echo "release.keystore missing"; exit 1; }
          cp release.keystore android/release.keystore

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 << 'PY'
          import os, pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text(encoding="utf-8")
          store_pass = os.environ["KEYSTORE_PASSWORD"].replace("'", "\\'")
          key_pass = os.environ["KEY_PASSWORD"].replace("'", "\\'")
          alias = os.environ["KEY_ALIAS"].replace("'", "\\'")
          signing = f'''
          signingConfigs {{
              release {{
                  storeFile file('../release.keystore')
                  storePassword '{store_pass}'
                  keyAlias '{alias}'
                  keyPassword '{key_pass}'
              }}
          }}
          '''
          if "signingConfigs" not in t:
              t = t.replace("android {", "android {\n" + signing, 1)
          if "signingConfig signingConfigs.release" not in t:
              t = re.sub(r'(buildTypes\s*\{[^}]*release\s*\{)',
                         r"\1\n            signingConfig signingConfigs.release", t, count=1, flags=re.S)
          t = t.replace("minifyEnabled true", "minifyEnabled false")
          p.write_text(t, encoding="utf-8")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK" || exit 1
          cp "$APK" Udar-Atma-Release.apk
          ls -lah Udar-Atma-Release.apk
          echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udar-atma-release-apk
          path: Udar-Atma-Release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: উদার আত্মা v${{ steps.apk.outputs.version }}
          body: |
            ফাইনাল আইকনসহ Release APK
            https://udar-atma.web.app/download
          files: Udar-Atma-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
