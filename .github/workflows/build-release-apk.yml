name: Build Release Signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Install npm packages
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Prepare icons (white background)
        run: |
          mkdir -p resources android/app/src/main/res/drawable

          # —— ১ম লোগো: অ্যাপ আইকন + নোটিফিকেশন বড় আইকন ——
          if [ ! -f icon-source.png ]; then
            echo "ERROR: icon-source.png (পূর্ণ সিল লোগো) রিপো রুটে লাগবে"
            exit 1
          fi
          # সাদা ব্যাকগ্রাউন্ডে বসান
          convert icon-source.png -background white -gravity center -extent 1024x1024 \
            resources/icon.png
          echo "App icon ready from icon-source.png"

          # —— ২য় লোগো: নোটিফিকেশন ছোট/একরঙা আইকন ——
          if [ -f icon-notification.png ]; then
            SRC_NOTIF=icon-notification.png
          else
            echo "WARNING: icon-notification.png নেই — icon-source ব্যবহার"
            SRC_NOTIF=icon-source.png
          fi
          # সাদা BG + স্ট্যাটাস বারের জন্য সাদা সিলুয়েটও তৈরি
          convert "$SRC_NOTIF" -background white -gravity center -extent 256x256 \
            android/app/src/main/res/drawable/ic_notification_large.png
          # Status bar: white on transparent (Android rule)
          convert "$SRC_NOTIF" -resize 96x96 -background none -gravity center -extent 96x96 \
            -colorspace Gray -threshold 40% -alpha on \
            -channel RGB -evaluate set 100% \
            android/app/src/main/res/drawable/ic_stat_udar.png || \
          convert "$SRC_NOTIF" -resize 96x96 -background white -gravity center -extent 96x96 \
            android/app/src/main/res/drawable/ic_stat_udar.png

          ls -la resources/ android/app/src/main/res/drawable/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#FFFFFF'
          find android/app/src/main/res -name "ic_launcher*" | sort | head -30

      - name: Re-copy notification drawables (cap may reset)
        run: |
          mkdir -p android/app/src/main/res/drawable
          if [ -f icon-notification.png ]; then SRC=icon-notification.png; else SRC=icon-source.png; fi
          convert "$SRC" -background white -gravity center -extent 256x256 \
            android/app/src/main/res/drawable/ic_notification_large.png
          convert "$SRC" -resize 96x96 -background none -gravity center -extent 96x96 \
            -colorspace Gray -threshold 40% -alpha on -channel RGB -evaluate set 100% \
            android/app/src/main/res/drawable/ic_stat_udar.png || true
          ls -la android/app/src/main/res/drawable/

      - name: Set app name
        run: |
          python3 -c "
          import pathlib, re
          p = pathlib.Path('android/app/src/main/res/values/strings.xml')
          t = p.read_text(encoding='utf-8')
          t = re.sub(r'<string name=\"app_name\">[^<]*</string>', '<string name=\"app_name\">উদার আত্মা</string>', t)
          t = re.sub(r'<string name=\"title_activity_main\">[^<]*</string>', '<string name=\"title_activity_main\">উদার আত্মা</string>', t)
          p.write_text(t, encoding='utf-8')
          "

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "default_notification_icon" "$MANIFEST"; then
            sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_udar" />\n    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="udar_atma_default" />\n    </application>|' "$MANIFEST"
          fi

      - name: Enable Google Services plugin
        run: |
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Prepare keystore
        run: |
          test -f release.keystore || { echo "release.keystore missing"; exit 1; }
          cp release.keystore android/release.keystore

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 << 'PY'
          import os, pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text(encoding="utf-8")
          store_pass = os.environ["KEYSTORE_PASSWORD"].replace("'", "\\'")
          key_pass = os.environ["KEY_PASSWORD"].replace("'", "\\'")
          alias = os.environ["KEY_ALIAS"].replace("'", "\\'")
          signing = f'''
          signingConfigs {{
              release {{
                  storeFile file('../release.keystore')
                  storePassword '{store_pass}'
                  keyAlias '{alias}'
                  keyPassword '{key_pass}'
              }}
          }}
          '''
          if "signingConfigs" not in t:
              t = t.replace("android {", "android {\n" + signing, 1)
          if "signingConfig signingConfigs.release" not in t:
              t = re.sub(r'(buildTypes\s*\{[^}]*release\s*\{)',
                         r"\1\n            signingConfig signingConfigs.release", t, count=1, flags=re.S)
          t = t.replace("minifyEnabled true", "minifyEnabled false")
          p.write_text(t, encoding="utf-8")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK" || exit 1
          cp "$APK" Udar-Atma-Release.apk
          ls -lah Udar-Atma-Release.apk
          echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udar-atma-release-apk
          path: Udar-Atma-Release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: উদার আত্মা v${{ steps.apk.outputs.version }}
          body: |
            লোগোসহ Release APK
            ডাউনলোড: https://udar-atma.web.app/download
          files: Udar-Atma-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
