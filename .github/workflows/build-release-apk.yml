name: Build Release Signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Install npm packages
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app name উদার আত্মা
        run: |
          python3 -c "
          import pathlib, re
          p = pathlib.Path('android/app/src/main/res/values/strings.xml')
          t = p.read_text(encoding='utf-8')
          t = re.sub(r'<string name=\"app_name\">[^<]*</string>', '<string name=\"app_name\">উদার আত্মা</string>', t)
          t = re.sub(r'<string name=\"title_activity_main\">[^<]*</string>', '<string name=\"title_activity_main\">উদার আত্মা</string>', t)
          p.write_text(t, encoding='utf-8')
          "

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "default_notification_channel_id" "$MANIFEST"; then
            sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="udar_atma_default" />\n    </application>|' "$MANIFEST"
          fi

      - name: Enable Google Services plugin
        run: |
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          ls -la android/release.keystore

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets missing"
            exit 1
          fi
          python3 << 'PY'
          import os, pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text(encoding="utf-8")
          store_pass = os.environ["KEYSTORE_PASSWORD"].replace("\\", "\\\\").replace("'", "\\'")
          key_pass = os.environ["KEY_PASSWORD"].replace("\\", "\\\\").replace("'", "\\'")
          alias = os.environ["KEY_ALIAS"].replace("\\", "\\\\").replace("'", "\\'")
          signing = f'''
          signingConfigs {{
              release {{
                  storeFile file('../release.keystore')
                  storePassword '{store_pass}'
                  keyAlias '{alias}'
                  keyPassword '{key_pass}'
              }}
          }}
          '''
          if "signingConfigs" not in t:
              t = t.replace("android {", "android {\n" + signing, 1)
          if "signingConfig signingConfigs.release" not in t:
              t = re.sub(
                  r'(buildTypes\s*\{[^}]*release\s*\{)',
                  r"\1\n            signingConfig signingConfigs.release",
                  t,
                  count=1,
                  flags=re.S,
              )
          t = t.replace("minifyEnabled true", "minifyEnabled false")
          p.write_text(t, encoding="utf-8")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        id: apk
        run: |
          OUT="android/app/build/outputs/apk/release"
          APK=$(find "$OUT" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi
          cp "$APK" Udar-Atma-Release.apk
          ls -lah Udar-Atma-Release.apk
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udar-atma-release-apk
          path: Udar-Atma-Release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: উদার আত্মা v${{ steps.apk.outputs.version }}
          body: |
            ## উদার আত্মা সংগঠন — Android অ্যাপ

            **ইনস্টল:**
            1. `Udar-Atma-Release.apk` ডাউনলোড করুন
            2. ফোনে **Unknown sources / Install unknown apps** অনুমতি দিন
            3. APK ওপেন করে Install চাপুন
            4. নোটিফিকেশন **Allow** + Battery → **Unrestricted**

            **ফিচার:** সদস্য ব্যবস্থাপনা, নোটিস, রক্তদান, নেটিভ পুশ নোটিফিকেশন

            ওয়েবসাইট আপডেট হলে অ্যাপে অটো দেখা যাবে।
          files: Udar-Atma-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
